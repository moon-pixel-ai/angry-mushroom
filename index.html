var el={};
function shroomIcon(key, size){
  var cv=document.createElement('canvas');
  cv.width=size*2; cv.height=size*2; cv.style.width=size+'px'; cv.style.height=size+'px';
  var c2=cv.getContext('2d');
  c2.scale(2,2);
  c2.translate(size/2, size*0.62);
  drawShroom(c2, SHROOM[key], size*0.30, true, false);
  return cv;
}
function updateHUD(){
  if(state==='title'||state==='select') return;
  el.round.textContent = 'R'+(levelIdx+1);
  el.lvname.textContent = levelDef.name;
  el.score.textContent = score.toLocaleString();
  var alive=aliveSnails();
  if(el._snail!==alive){ el._snail=alive; el.snailN.textContent=alive+' / '+snails.length; }
  var sig = (current?current.def.key:'-')+'|'+queue.join(',')+'|'+state;
  if(el._sig!==sig){
    el._sig=sig;
    el.ammo.innerHTML='';
    var list = queue.slice();
    for(var i=0;i<list.length;i++){
      var wrap=document.createElement('div');
      wrap.className='ammo'+(i===0?' cur':'');
      wrap.appendChild(shroomIcon(list[i], i===0?46:34));
      el.ammo.appendChild(wrap);
    }
    el.ability.textContent = current ? current.def.name+' — '+current.def.desc : '';
  }
}

function show(id,on){ document.getElementById(id).style.display = on?'flex':'none'; }
function openTitle(){
  HP=null;
  document.getElementById('hoophud').style.display='none';
  document.getElementById('hoopover').style.display='none';
  show('quiz',false);
  state='title'; show('title',true); show('select',false); show('result',false); show('hud',false);
}
function openSelect(){
  HP=null;
  document.getElementById('hoophud').style.display='none';
  document.getElementById('hoopover').style.display='none';
  show('quiz',false);
  state='select'; show('title',false); show('result',false); show('hud',false); show('select',true);
  var grid=document.getElementById('grid'); grid.innerHTML='';
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var locked = !teacher && i>progress.cleared;
      var d=document.createElement('button');
      d.className='cell'+(locked?' locked':'');
      var st=progress.stars[''+i]||0;
      var stars='';
      for(var k=0;k<3;k++) stars += '<span class="'+(k<st?'on':'off')+'">★</span>';
      d.innerHTML = '<div class="num">'+(i+1)+'</div><div class="nm">'+LEVELS[i].name+'</div>'+
                    '<div class="stars">'+(locked?'🔒':stars)+'</div>';
      if(!locked) d.onclick=function(){ startLevel(i); };
      grid.appendChild(d);
    })(i);
  }
  document.getElementById('tbadge').style.display = teacher ? 'flex' : 'none';
  var mb=document.getElementById('btnHoop');
  if(teacher || progress.cleared >= LEVELS.length){
    mb.className='minibtn';
    mb.innerHTML='🏀 보너스 — 머쉬룸 점프 슛' +
      (hoopBest()? ' &nbsp;·&nbsp; 최고 '+hoopBest().toLocaleString()+'점' : ' &nbsp;·&nbsp; 고리를 몇 개나 통과할까?');
    mb.onclick=function(){ startHoop(); };
  } else {
    mb.className='minibtn lock';
    mb.innerHTML='🔒 보너스 미니게임 — 10라운드를 모두 클리어하면 열려 ('+progress.cleared+'/'+LEVELS.length+')';
    mb.onclick=null;
  }
  var ub=document.getElementById('unlockbar'); ub.innerHTML='';
  var un=unlockedShrooms();
  SHROOM_ORDER.forEach(function(k){
    var have = un.indexOf(k)>=0;
    var w=document.createElement('div'); w.className='ubox'+(have?'':' lock');
    w.appendChild(shroomIcon(k,44));
    var nm=document.createElement('div'); nm.className='ubn';
    var need=0; for(var r in UNLOCK) if(UNLOCK[r]===k) need=parseInt(r,10);
    nm.textContent = have? SHROOM[k].name : ('R'+need+' 해금');
    w.appendChild(nm);
    if(have){ w.title=SHROOM[k].desc; }
    ub.appendChild(w);
  });
}
function startLevel(i){
  show('title',false); show('select',false); show('result',false); show('quiz',false); show('hud',true);
  document.getElementById('hoophud').style.display='none';
  zoom=1; resize();
  buildLevel(i);
  el._sig=null; el._snail=-1;
  var tip=document.getElementById('tip');
  tip.textContent = LEVELS[i].tip;
  tip.style.display='block';
  clearTimeout(window._tipT);
  window._tipT=setTimeout(function(){ tip.style.display='none'; }, 5200);
}

var resultShown=false, quizDone=false;
function pollResult(){
  if((state==='won'||state==='lost') && !resultShown){
    resultShown=true;
    if(state==='won'){ quizDone=false; startQuiz(); }
    else showResultCard(false);
  }
  if(state!=='won'&&state!=='lost') resultShown=false;
}
function showResultCard(won){
    show('result',true);
    document.getElementById('rtitle').textContent = won? '클리어!' : '실패…';
    document.getElementById('rtitle').className = won?'win':'lose';
    document.getElementById('rscore').textContent = score.toLocaleString()+' 점';
    var st = won? starsFor(score):0;
    var h='';
    for(var k=0;k<3;k++) h+='<span class="'+(k<st?'on':'off')+'">★</span>';
    document.getElementById('rstars').innerHTML=h;
    var nx=document.getElementById('btnNext');
    nx.style.display = (won && levelIdx+1<LEVELS.length)?'inline-block':'none';
    var msg=document.getElementById('rmsg');
    if(won && UNLOCK[levelIdx+2]){
      msg.innerHTML='새 버섯 해금 : <b>'+SHROOM[UNLOCK[levelIdx+2]].name+'</b> — '+SHROOM[UNLOCK[levelIdx+2]].desc;
      msg.style.display='block';
    } else if(!won){
      msg.textContent='버섯이 다 떨어졌어. 기둥을 먼저 노려 봐.'; msg.style.display='block';
    } else { msg.style.display='none'; }
    if(teacher){
      msg.innerHTML='🔑 선생님 모드 — 이 판의 기록은 저장되지 않습니다.';
      msg.style.display='block';
    }
}
setInterval(pollResult, 120);

/* ============================================================
   init
   ============================================================ */
function init(){
  canvas=document.getElementById('cv');
  ctx=canvas.getContext('2d');
  el.round=document.getElementById('hround');
  el.lvname=document.getElementById('hname');
  el.score=document.getElementById('hscore');
  el.snailN=document.getElementById('hsnail');
  el.ammo=document.getElementById('hammo');
  el.ability=document.getElementById('hability');

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  canvas.addEventListener('contextmenu', function(e){e.preventDefault();});

  document.getElementById('btnStart').onclick=openSelect;
  document.getElementById('btnBack').onclick=openSelect;
  document.getElementById('btnMenu').onclick=function(){ show('result',false); openSelect(); };
  document.getElementById('btnRetry').onclick=function(){ show('result',false); startLevel(levelIdx); };
  document.getElementById('btnNext').onclick=function(){ show('result',false); startLevel(Math.min(LEVELS.length-1, levelIdx+1)); };
  document.getElementById('btnRestart').onclick=function(){ startLevel(levelIdx); };
  // ---- 선생님 모드 : Shift 를 누른 채 '교사' 입력 ----
  // 두벌식에서 교사 = ㄱ(R) ㅛ(Y) ㅅ(T) ㅏ(K). 물리 키 코드로 보기 때문에
  // 한/영 상태와 상관없이 동작한다.
  var T_SEQ = ['KeyR','KeyY','KeyT','KeyK'], tSeq = [];
  function toggleTeacher(){
    teacher = !teacher;
    toast(teacher ? '🔑 선생님 모드 ON — 모든 라운드·미니게임 열림'
                  : '선생님 모드 해제');
    if(state==='select') openSelect();
  }
  window.addEventListener('keydown', function(e){
    var code = e.code || '';
    if(code==='ShiftLeft'||code==='ShiftRight') return;   // Shift 자체는 무시
    if(!e.shiftKey){ tSeq.length=0; return; }
    tSeq.push(code);
    if(tSeq.length > T_SEQ.length) tSeq.shift();
    if(tSeq.length===T_SEQ.length){
      var ok=true;
      for(var i=0;i<T_SEQ.length;i++) if(tSeq[i]!==T_SEQ[i]) ok=false;
      if(ok){ tSeq.length=0; toggleTeacher(); }
    }
  });
  window.addEventListener('keyup', function(e){
    if(e.code==='ShiftLeft'||e.code==='ShiftRight') tSeq.length=0;
  });
  document.getElementById('tOff').onclick=function(){ teacher=false; toast('선생님 모드 해제'); openSelect(); };

  document.getElementById('hpQuit').onclick=quitHoop;
  document.getElementById('hoQuit').onclick=quitHoop;
  document.getElementById('hoRetry').onclick=function(){ startHoop(); };
  document.getElementById('btnZoomIn').onclick=function(){ setZoom(zoom*1.25); };
  document.getElementById('btnZoomOut').onclick=function(){ setZoom(zoom/1.25); };
  document.getElementById('btnFit').onclick=function(){ fitAll(); };
  canvas.addEventListener('wheel', function(e){
    if(state==='title'||state==='select') return;
    e.preventDefault();
    setZoom(zoom * (e.deltaY>0 ? 0.90 : 1.11));
  }, {passive:false});
  document.getElementById('btnMute').onclick=function(){
    muted=!muted; this.textContent = muted?'🔇':'🔊';
  };
  document.getElementById('btnReset').onclick=function(){
    if(confirm('모든 진행(클리어·별)을 지울까요?')){
      progress={stars:{},cleared:0,hoopBest:0,hv:2}; saveProgress(); openSelect();
    }
  };
  window.addEventListener('keydown', function(e){
    if(e.key===' '){ e.preventDefault(); if(state==='flying') tapAbility(); }
    if(e.key==='r'||e.key==='R'){ if(state!=='title'&&state!=='select'&&state!=='hoop') startLevel(levelIdx); }
    if(e.key==='+'||e.key==='='){ setZoom(zoom*1.25); }
    if(e.key==='-'||e.key==='_'){ setZoom(zoom/1.25); }
    if(e.key==='0'){ fitAll(); }
  });

  resize();
  openTitle();
  requestAnimationFrame(tick);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();

var DET=false;
window.__AM__ = {
  det:function(v){ DET=!!v; },
  /* 결정론적 전체 재생 : shots = [{p, a(도), horn(스텝|null)}] */
  replay:function(lvl, shots){
    DET=true; muted=true;
    buildLevel(lvl); introT=0;
    for(var i=0;i<shots.length;i++){
      if(state!=='aim' && state!=='zombieAim') break;
      var sh=shots[i], r=sh.a*Math.PI/180;
      var dx=-Math.cos(r)*sh.p, dy=Math.sin(r)*sh.p;
      window.__AM__.autoLaunch(dx,dy);
      var n=0;
      while(state==='flying' && n<900){
        if(sh.horn!=null && n===sh.horn) tapAbility();
        simStep(1/60); n++;
      }
      var m=0;
      while(state!=='aim' && state!=='zombieAim' && state!=='won' && state!=='lost' && m<600){ simStep(1/60); m++; }
      if(state==='won'||state==='lost') break;
    }
    var g=0;
    while(state!=='won' && state!=='lost' && g<1200){ simStep(1/60); g++; }
    muted=false;
    return { won:state==='won', left:aliveSnails(), tot:snails.length, score:score };
  },
  get state(){return state;}, get score(){return score;},
  get blocks(){return blocks;}, get snails(){return snails;},
  LEVELS:LEVELS, buildLevel:function(i){ buildLevel(i); }, step:function(n){ for(var i=0;i<n;i++){ Engine.update(engine,1000/60);
    if(removeQueue.length){ for(var j=0;j<removeQueue.length;j++) Composite.remove(world,removeQueue[j]); removeQueue.length=0; } } },
  launchAt:function(dx,dy){ launch({x:SLING_X+dx,y:SLING_Y+dy},{x:-dx*VEL_K,y:-dy*VEL_K}); },
  autoLaunch:function(dx,dy){
    if(!current) return false;
    if(state==='aim'){ launch({x:SLING_X+dx,y:SLING_Y+dy},{x:-dx*VEL_K,y:-dy*VEL_K}); return true; }
    if(state==='zombieAim'){
      var a=current.zAnchor, bd=current.body;
      Body.setStatic(bd,false); Body.setPosition(bd,{x:a.x,y:a.y});
      Body.setVelocity(bd,{x:-dx*VEL_K*0.86, y:-dy*VEL_K*0.86});
      state='flying'; current.restT=0; current.flyT=0; return true;
    }
    return false;
  },
  aliveSnails:function(){return aliveSnails();},
  proj:function(){ return current? current.body : null; },
  get camX(){ return camX; }, get teacher(){ return teacher; },
  setFirst: function(k){ if(current) Composite.remove(world, current.body); queue[0]=k; loadNext(); introT=0; },
  shroomInfo: function(k){ var d=SHROOM[k]; return {r:d.r, density:d.density, mass:Math.PI*d.r*d.r*d.density}; },
  QGEN_NAMES: Object.keys(QGEN), ROUND_Q: ROUND_Q,
  mkQ: function(n){ return makeQuestion(n); },
  startHoop: function(){ startHoop(); },
  forceWin: function(){ snails.forEach(function(s){ if(!s.gd.dead){ s.gd.dead=true; removeQueue.push(s); } }); checkEnd(false); },
  quizState: function(){ return QZ? {idx:QZ.idx, mode:QZ.mode, res:QZ.res.slice(), ans:QZ.qs[QZ.idx].ans, kind:QZ.qs[QZ.idx].kind, gens:QZ.qs.map(function(q){return q.gen;})} : null; },
  get HP(){ return HP; },
  hoopShoot: function(dx,dy){ if(!HP||HP.flying) return false;
    HP.ball.x=HP.anchor.x; HP.ball.y=HP.anchor.y;
    HP.ball.vx=-dx*HP_K; HP.ball.vy=-dy*HP_K; HP.flying=true; HP.touchedRim=false; HP.trail=[]; return true; },
  hoopSim: function(n){ for(var i=0;i<n;i++) hoopStep(); },
  respawnHoop: function(){ spawnHoop(); },
  feasible: function(dx,gap,r){ return hoopFeasible(dx,gap,r); },
  w2s:function(wx,wy){ var r=canvas.getBoundingClientRect(); var k=r.width/canvas.width;
    return { x:r.left+(wx-camX)*scale*k, y:r.top+(wy-camY)*scale*k, k:scale*k }; },
  skipIntro:function(){ introT=0; camTargetX=0; camX=0; },
  sim:function(n){ for(var i=0;i<n;i++) simStep(1/60); },
  setZoom:function(z){ setZoom(z); }, fitAll:function(){ fitAll(); },
  get zoom(){ return zoom; }, get viewW(){ return viewW; },
  usedAbility:function(){ return current? !!current.used : false; },
  jumpV:function(){ return current? current.jumpV||null : null; },
  hornCount:function(){ var n=0, a=Composite.allBodies(world);
    for(var i=0;i<a.length;i++) if(a[i].label==='horn') n++; return n; }
};

})();

</script>
