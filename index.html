<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>앵그리 머쉬룸 — 탄성력 미니게임</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#12202e;
  font-family:"Noto Sans KR","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;}
#wrap{position:fixed;inset:0;}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;display:none;flex-direction:column;}
#topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;
  padding-top:calc(8px + env(safe-area-inset-top,0px));
  background:linear-gradient(180deg,rgba(10,22,36,.72),rgba(10,22,36,0));}
.chip{background:rgba(9,20,34,.72);border:1px solid rgba(255,255,255,.18);border-radius:12px;
  padding:6px 12px;color:#e8f2ff;font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px;white-space:nowrap;}
.chip b{color:#ffe08a;font-size:15px;}
#hname{color:#bcd6f5;font-weight:500;}
#spacer{flex:1;}
.btn{pointer-events:auto;cursor:pointer;background:rgba(9,20,34,.72);border:1px solid rgba(255,255,255,.22);
  border-radius:12px;color:#e8f2ff;font-size:15px;padding:7px 13px;font-family:inherit;font-weight:600;}
.btn:active{transform:scale(.95);}
.btn.zb{min-width:42px;font-size:19px;line-height:1;padding:6px 10px;}

#ammobar{position:absolute;left:10px;bottom:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:flex-end;gap:6px;}
.ammo{background:rgba(9,20,34,.55);border-radius:14px;padding:4px 6px;display:flex;align-items:flex-end;
  border:1px solid rgba(255,255,255,.12);}
.ammo.cur{background:rgba(255,215,120,.22);border-color:rgba(255,215,120,.6);}
#hability{position:absolute;left:10px;bottom:calc(84px + env(safe-area-inset-bottom,0px));
  color:#dceaff;font-size:13px;background:rgba(9,20,34,.6);padding:5px 11px;border-radius:10px;max-width:min(92vw,520px);}
#tip{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));
  background:rgba(12,26,42,.86);color:#ffeab0;border:1px solid rgba(255,220,140,.35);
  padding:10px 16px;border-radius:14px;font-size:14px;max-width:min(92vw,560px);text-align:center;display:none;}

/* ---------- 오버레이 ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:22px;padding-top:calc(22px + env(safe-area-inset-top,0px));
  padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));overflow:auto;}
#title{background:transparent;}
.logo{font-size:clamp(34px,7.4vw,66px);font-weight:900;color:#fff;letter-spacing:-1px;
  text-shadow:0 5px 0 #b9541b,0 8px 24px rgba(0,0,0,.35);margin:0;text-align:center;line-height:1.1;}
.sub{color:#0f3b52;font-weight:700;margin:10px 0 26px;font-size:clamp(14px,2.6vw,19px);text-align:center;
  background:rgba(255,255,255,.65);padding:7px 16px;border-radius:999px;}
.big{pointer-events:auto;cursor:pointer;border:none;border-radius:18px;padding:16px 46px;font-size:21px;font-weight:800;
  font-family:inherit;color:#5a2b06;background:linear-gradient(180deg,#ffd76a,#f2a428);
  box-shadow:0 5px 0 #c1761a,0 10px 22px rgba(0,0,0,.28);}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #c1761a;}

#select{background:rgba(10,24,38,.93);}
#select h2{color:#fff;margin:0 0 4px;font-size:24px;}
#select p.hint{color:#9fb8d4;margin:0 0 16px;font-size:13px;text-align:center;}
#unlockbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:18px;}
.ubox{display:flex;flex-direction:column;align-items:center;gap:3px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:8px 10px;min-width:72px;}
.ubox.lock{opacity:.38;filter:grayscale(1);}
.ubn{color:#cfe0f5;font-size:11px;font-weight:600;}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;
  width:min(96vw,760px);}
.cell{pointer-events:auto;cursor:pointer;background:linear-gradient(180deg,#2c66a0,#1e4877);border:1px solid rgba(255,255,255,.2);
  border-radius:14px;padding:11px 8px;color:#fff;font-family:inherit;text-align:center;}
.cell:active{transform:scale(.96);}
.cell.locked{background:rgba(255,255,255,.07);color:#7e93ab;cursor:default;}
.cell .num{font-size:20px;font-weight:900;}
.cell .nm{font-size:12px;opacity:.9;margin:2px 0 5px;min-height:15px;}
.stars span{font-size:15px;}
.stars .on{color:#ffd54a;} .stars .off{color:rgba(255,255,255,.22);}

#result{background:rgba(8,18,30,.86);}
.card{background:linear-gradient(180deg,#1f4a74,#153252);border:1px solid rgba(255,255,255,.2);
  border-radius:22px;padding:26px 30px;text-align:center;color:#fff;max-width:min(92vw,440px);}
#rtitle{font-size:32px;font-weight:900;margin:0 0 8px;}
#rtitle.win{color:#ffd76a;} #rtitle.lose{color:#ff9d9d;}
#rstars span{font-size:34px;margin:0 2px;}
#rscore{font-size:20px;font-weight:700;color:#cfe6ff;margin:8px 0 6px;}
#rmsg{font-size:13px;color:#b9d2ef;background:rgba(0,0,0,.22);padding:9px 12px;border-radius:12px;margin:10px 0 0;display:none;}
.row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:18px;}
.btn2{pointer-events:auto;cursor:pointer;border:none;border-radius:14px;padding:11px 20px;font-size:15px;font-weight:700;
  font-family:inherit;color:#123;background:linear-gradient(180deg,#ffd76a,#f2a428);box-shadow:0 4px 0 #c1761a;}
.btn2.ghost{background:rgba(255,255,255,.14);color:#dceaff;box-shadow:0 4px 0 rgba(0,0,0,.25);}
.btn2:active{transform:translateY(2px);box-shadow:none;}
#credit{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:rgba(255,255,255,.55);font-size:11px;}

/* ---------- 퀴즈 ---------- */
#quiz{background:rgba(6,16,28,.94);justify-content:flex-start;}
.qcard{background:linear-gradient(180deg,#1b3d60,#12283f);border:1px solid rgba(255,255,255,.18);
  border-radius:20px;padding:18px 20px 20px;width:min(94vw,560px);color:#eaf3ff;margin:auto;}
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#9fc0e4;margin-bottom:10px;}
.qtop b{color:#ffd76a;}
#qfig{margin:0 0 12px;text-align:center;}
.qsvg{width:100%;max-width:340px;height:auto;border-radius:12px;border:1px solid rgba(255,255,255,.14);}
.qtab{border-collapse:collapse;margin:0 auto;font-size:13px;width:100%;max-width:400px;}
.qtab th,.qtab td{border:1px solid rgba(255,255,255,.22);padding:6px 4px;text-align:center;}
.qtab th{background:rgba(255,255,255,.10);color:#cfe3ff;font-weight:600;white-space:nowrap;}
.qtab td{color:#ffe9a8;}
#qtext{font-size:16px;line-height:1.6;margin-bottom:14px;}
.qsm{font-size:12px;color:#9fc0e4;}
#qchoices{display:flex;flex-direction:column;gap:8px;}
#qchoices.ox{flex-direction:row;justify-content:center;gap:14px;}
.qch{pointer-events:auto;cursor:pointer;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);
  border-radius:14px;padding:12px 14px;color:#eaf3ff;font-family:inherit;font-size:15px;text-align:left;font-weight:600;}
.qch:active{transform:scale(.98);}
#qchoices.ox .qch{flex:1;max-width:170px;text-align:center;font-size:20px;padding:20px 10px;}
.qch.ok{background:rgba(90,200,120,.30);border-color:#6fd58c;}
.qch.no{background:rgba(230,90,90,.28);border-color:#e87b7b;}
.qch.dim{opacity:.45;}
#qfeed{margin-top:14px;font-size:14px;line-height:1.6;border-radius:14px;padding:12px 14px;display:none;}
#qfeed.ok{background:rgba(90,200,120,.16);border:1px solid rgba(110,220,150,.45);}
#qfeed.no{background:rgba(230,90,90,.16);border:1px solid rgba(240,130,130,.45);}
#qfeed .ft{font-weight:800;font-size:16px;display:block;margin-bottom:5px;}

/* ---------- 선생님 모드 ---------- */
#tbadge{display:none;align-items:center;gap:10px;background:rgba(255,215,120,.18);
  border:1px solid rgba(255,215,120,.55);color:#ffe08a;border-radius:999px;
  padding:5px 8px 5px 14px;font-size:12px;font-weight:700;margin-bottom:12px;}
#tOff{pointer-events:auto;cursor:pointer;border:none;border-radius:999px;padding:4px 12px;
  font-family:inherit;font-size:12px;font-weight:700;color:#3a1f00;background:#ffd76a;}
#ttoast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;
  background:rgba(12,26,42,.94);border:1px solid rgba(255,215,120,.6);color:#ffe08a;
  padding:16px 26px;border-radius:16px;font-size:17px;font-weight:800;display:none;
  pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.4);}

/* ---------- 미니게임 ---------- */
#hoophud{position:absolute;inset:0;pointer-events:none;display:none;flex-direction:column;}
#hoopover{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(6,16,28,.86);}
.hcard{background:linear-gradient(180deg,#24406b,#16293f);border:1px solid rgba(255,255,255,.2);
  border-radius:22px;padding:26px 30px;text-align:center;color:#fff;max-width:min(92vw,420px);}
.hbig{font-size:34px;font-weight:900;color:#ffd76a;margin:6px 0;}
.hsub{font-size:14px;color:#bcd6f5;}
#mini{margin-top:14px;width:min(96vw,760px);}
.minibtn{pointer-events:auto;cursor:pointer;width:100%;border:none;border-radius:16px;padding:14px 16px;
  font-family:inherit;font-size:16px;font-weight:800;color:#3a1f00;
  background:linear-gradient(180deg,#ffd76a,#f2a428);box-shadow:0 4px 0 #c1761a;}
.minibtn.lock{background:rgba(255,255,255,.08);color:#7e93ab;box-shadow:none;cursor:default;}
.minibtn:active{transform:translateY(2px);}
</style>
</head>
<body>
<div id="ttoast"></div>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div id="topbar">
      <div class="chip"><b id="hround">R1</b><span id="hname"></span></div>
      <div class="chip">🐌 <b id="hsnail">0 / 0</b></div>
      <div class="chip">⭐ <b id="hscore">0</b></div>
      <div id="spacer"></div>
      <button class="btn zb" id="btnZoomOut">－</button>
      <button class="btn zb" id="btnZoomIn">＋</button>
      <button class="btn" id="btnFit">전체</button>
      <button class="btn" id="btnMute">🔊</button>
      <button class="btn" id="btnRestart">↻</button>
      <button class="btn" id="btnBack">목록</button>
    </div>
    <div id="tip"></div>
    <div id="hability"></div>
    <div id="ammobar"><div id="hammo" style="display:flex;gap:6px;align-items:flex-end"></div></div>
  </div>

  <div class="screen" id="title">
    <h1 class="logo">앵그리 머쉬룸</h1>
    <div class="sub">고무줄을 당겨라 · 달팽이 왕국을 무너뜨려라</div>
    <button class="big" id="btnStart">시작하기</button>
    <div id="credit">중1 과학 · 탄성력 &nbsp;|&nbsp; 당긴 길이에 비례하는 탄성력 F = k x</div>
  </div>

  <div class="screen" id="select">
    <h2>라운드 선택</h2>
    <p class="hint">라운드를 클리어하면 새로운 버섯이 해금됩니다</p>
    <div id="tbadge"><span>🔑 선생님 모드 — 모든 라운드·미니게임 열림 · 퀴즈 건너뛰기 가능</span><button id="tOff">해제</button></div>
    <div id="unlockbar"></div>
    <div id="grid"></div>
    <div id="mini"><button class="minibtn lock" id="btnHoop">🔒 ??? — 10라운드를 모두 클리어하면 열려</button></div>
    <div class="row">
      <button class="btn2 ghost" id="btnReset">진행 초기화</button>
    </div>
  </div>

  <div class="screen" id="quiz">
    <div class="qcard">
      <div class="qtop"><span id="qstep">1 / 2</span><span id="qtag">🍄 탄성력 퀴즈</span></div>
      <div id="qfig"></div>
      <div id="qtext"></div>
      <div id="qchoices"></div>
      <div id="qfeed"></div>
      <div class="row" id="qbtns"></div>
    </div>
  </div>

  <div id="hoophud">
    <div id="topbar" style="pointer-events:none">
      <div class="chip">🏀 <b id="hpScore">0</b></div>
      <div class="chip">높이 <b id="hpHeight">0</b> m</div>
      <div class="chip" id="hpLifeChip">🍄 <b id="hpLife">3</b></div>
      <div class="chip">최고 <b id="hpBest">0</b></div>
      <div id="spacer"></div>
      <button class="btn" id="hpQuit" style="pointer-events:auto">나가기</button>
    </div>
    <div id="hoopover">
      <div class="hcard">
        <div class="hsub" id="hoTitle">게임 오버</div>
        <div class="hbig" id="hoScore">0</div>
        <div class="hsub" id="hoMsg"></div>
        <div class="row">
          <button class="btn2 ghost" id="hoQuit">목록</button>
          <button class="btn2" id="hoRetry">다시 도전</button>
        </div>
      </div>
    </div>
  </div>

  <div class="screen" id="result">
    <div class="card">
      <div id="rtitle">클리어!</div>
      <div id="rstars"></div>
      <div id="rscore">0 점</div>
      <div id="rmsg"></div>
      <div class="row">
        <button class="btn2 ghost" id="btnMenu">목록</button>
        <button class="btn2 ghost" id="btnRetry">다시</button>
        <button class="btn2" id="btnNext">다음 라운드 →</button>
      </div>
    </div>
  </div>
</div>
<script>

<script>
/* ============================================================

(function(){
'use strict';

var Engine=M.Engine, World=M.World, Bodies=M.Bodies, Body=M.Body,
    Composite=M.Composite, Events=M.Events, Vector=M.Vector;

/* ---------- 상수 ---------- */

var GROUND_Y  = 648;          // 지면 윗면
var SLING_X   = 205;          // 새총 기둥 x
var SLING_Y   = GROUND_Y-158; // 고무줄 거치 높이
var MAX_PULL  = 132;          // 최대 당김 (world px)
var VEL_K     = 0.170;        // 당김 → 속도
var CM_PER_PX = 30/MAX_PULL;  // 화면 당김을 cm 로 환산
var SPRING_K  = 0.50;         // N/cm  (표시용)
var SPEED     = 0.62;         // 물리 진행 속도 (1 = 실시간)
var ZOOM_MIN  = 0.34, ZOOM_MAX = 1.70;
var MAX_REACH = 1760;         // 최대 사거리 안쪽 — 구조물은 이 x 를 넘지 않게

var MAT = {
  wood : { hp: 24,  density:0.0010, fill:'#c08a4a', edge:'#8a5a28', name:'나무' },

  glass: { hp: 8,   density:0.0008, fill:'#a8e4f2', edge:'#5fb6cd', name:'유리' },
  steel: { hp: 999, density:0.0040, fill:'#6d7683', edge:'#3d4550', name:'강철' },
  tnt  : { hp: 11,  density:0.0014, fill:'#c9453c', edge:'#7d221c', name:'TNT'  }
};

var SHROOM = {
  orange: { key:'orange', name:'주황버섯', r:19, density:0.0013, cap:'#f59a2e', cap2:'#d97a15', spot:'#ffd27a',

            desc:'바닥에 닿는 순간 대각선 위로 한 번 점프!' },

            desc:'멈춘 자리에서 되살아나 한 번 더 발사!' },
  king  : { key:'king',   name:'왕버섯',   r:31, density:0.0030, cap:'#f5762e', cap2:'#c04d11', spot:'#ffc98a',

};
var SHROOM_ORDER = ['orange','horn','blue','zombie','king'];
var UNLOCK = { 3:'horn', 5:'blue', 7:'zombie', 9:'king' };

/* ============================================================
   레벨 구성 블록
   ============================================================ */
function B(mat,cx,cy,w,h){ return {m:mat,x:cx,y:cy,w:w,h:h,s:'rect'}; }
function V(mat,x,baseY,len,w){ w=w||22; return B(mat,x,baseY-len/2,w,len); }
function H(mat,cx,baseY,len,t){ t=t||20; return B(mat,cx,baseY-t/2,len,t); }
function CUBE(mat,cx,baseY,sz){ sz=sz||30; return B(mat,cx,baseY-sz/2,sz,sz); }
function TRI(mat,cx,baseY,w,h){ return {m:mat,x:cx,y:baseY-h/2,w:w,h:h,s:'tri'}; }
function TNT(cx,baseY){ return {m:'tnt',x:cx,y:baseY-23,w:34,h:46,s:'rect'}; }
function S(x,baseY){ return {x:x, y:baseY-17}; }

/* 방 한 칸 : 기둥 2 + 천장. leftX = 왼쪽 기둥 바깥면 */
function bay(out, mat, leftX, baseY, innerW, innerH, colW, ceilT){
  colW = colW||22; ceilT = ceilT||20;
  var lx = leftX + colW/2;
  var rx = leftX + colW + innerW + colW/2;
  out.push(B(mat, lx, baseY-innerH/2, colW, innerH));
  out.push(B(mat, rx, baseY-innerH/2, colW, innerH));
  var w  = colW*2 + innerW;
  var cx = leftX + w/2;
  out.push(B(mat, cx, baseY-innerH-ceilT/2, w, ceilT));
  return { cx:cx, top:baseY-innerH-ceilT, w:w, left:leftX, right:leftX+w, inner:innerW };

function bay2(out, mat, leftX, baseY, innerW, innerH, colW, ceilT){
  colW = colW||22; ceilT = ceilT||20;
  var xs=[], x=leftX;
  for(var i=0;i<3;i++){ xs.push(x+colW/2); x += colW+innerW; }
  xs.forEach(function(px){ out.push(B(mat, px, baseY-innerH/2, colW, innerH)); });
  var w = colW*3 + innerW*2;
  var cx = leftX + w/2;
  out.push(B(mat, cx, baseY-innerH-ceilT/2, w, ceilT));
  return { cx:cx, top:baseY-innerH-ceilT, w:w, left:leftX, right:leftX+w,
           room:[ leftX+colW+innerW/2, leftX+colW*2+innerW*1.5 ] };
}

var AC=null, muted=false;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=false; } } return AC; }
function beep(freq, dur, type, vol, slideTo){
  if(muted) return; var c=ac(); if(!c) return;
  try{
    if(c.state==='suspended') c.resume();
    var o=c.createOscillator(), gn=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq, c.currentTime);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime+dur);
    gn.gain.setValueAtTime(vol||0.08, c.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+dur);
    o.connect(gn); gn.connect(c.destination); o.start(); o.stop(c.currentTime+dur);
  }catch(e){}
}
function noise(dur, vol){
  if(muted) return; var c=ac(); if(!c) return;
  try{
    if(c.state==='suspended') c.resume();
    var n=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    var src=c.createBufferSource(), gn=c.createGain();
    src.buffer=buf; gn.gain.value=vol||0.12;
    src.connect(gn); gn.connect(c.destination); src.start();
  }catch(e){}
}

  var wl = Bodies.rectangle(-60, 0, 120, 4000, {isStatic:true, label:'wall'});
  var wr = Bodies.rectangle(W+60, 0, 120, 4000, {isStatic:true, label:'wall'});

            [[{x:-d.w/2,y:d.h/2},{x:d.w/2,y:d.h/2},{x:0,y:-d.h/2}]], opt);
      if(!b) b = Bodies.rectangle(d.x, d.y, d.w, d.h, opt);
    } else {
      b = Bodies.rectangle(d.x, d.y, d.w, d.h, opt);
    }
    b.gd = { mat:d.m, hp:m.hp, maxhp:m.hp, w:d.w, h:d.h, shape:d.s||'rect', dead:false };

  var minX=1e9, maxX=-1e9;
  levelDef.blocks.forEach(function(d){ minX=Math.min(minX,d.x-d.w/2); maxX=Math.max(maxX,d.x+d.w/2); });
  levelDef.snails.forEach(function(d){ minX=Math.min(minX,d.x); maxX=Math.max(maxX,d.x); });
  introTarget = (minX+maxX)/2 - viewW/2;
  introT = 1.7;
  var cb0 = camBounds();
  camX = Math.max(cb0[0], Math.min(cb0[1], introTarget));
  camTargetX = camX;
  loadNext();
  camTargetX = camX;
  state='aim';
}

/* 눌려 죽는 판정 (지속 압력) */
function onCrush(pairs){
  for(var i=0;i<pairs.length;i++){
    var p=pairs[i];
    var arr=[[p.bodyA,p.bodyB],[p.bodyB,p.bodyA]];
    for(var k=0;k<2;k++){
      var t=arr[k][0], o=arr[k][1];
      if(t.label!=='snail'||t.gd.dead) continue;
      if(o.isStatic) continue;
      if(o.mass>1.6 && o.position.y < t.position.y-6 && Math.abs(o.velocity.y)<1.3){
        t.gd.hp -= 0.050*o.mass;
        if(t.gd.hp<=0) killSnail(t);
      }
    }
  }
}

function loadNext(){
  current=null; pull={x:0,y:0}; dragFromZombie=false;
  if(!queue.length){ checkEnd(true); return; }
  var key = queue[0];
  var def = SHROOM[key];
  var b = Bodies.circle(SLING_X, SLING_Y, def.r, {
    density:def.density, friction:0.55, frictionAir:0.0012, restitution:0.38,
    label:'shroom', collisionFilter:{ mask:0 }
  });
  Body.setStatic(b, true);
  b.gd = { def:def, live:false };
  current = { body:b, def:def, used:false, grounded:false, restT:0, zombieReady:false, zombieSpent:false, launched:false };
  Composite.add(world, b);
  state='aim';
  camTargetX = 0;
}

/* ============================================================
   발사
   ============================================================ */
function launch(from, vec){
  var b = current.body;
  Body.setStatic(b, false);
  b.collisionFilter.mask = 0xFFFFFFFF;
  b.gd.live = true;
  Body.setPosition(b, from);
  Body.setVelocity(b, vec);
  Body.setAngularVelocity(b, DET?0:(Math.random()-0.5)*0.4);
  current.launched = true;
  state='flying'; settleT=0;
  lastTrail = trail.slice(); trail=[];
  shotsUsed++;
  SFX.launch();
}

function tapAbility(){
  if(state!=='flying' || !current || current.used) return;
  if(current.def.key!=='horn') return;
  var b=current.body;
  var v = b.velocity, sp=Math.hypot(v.x,v.y);
  var dir = sp>1.2 ? {x:v.x/sp, y:v.y/sp} : {x:1,y:-0.15};
  var horn = Bodies.circle(b.position.x+dir.x*(current.def.r+9), b.position.y+dir.y*(current.def.r+9), 7, {
    density:0.010, friction:0.3, restitution:0.1, frictionAir:0.0006, label:'horn'
  });
  horn.gd = { def:null };
  Composite.add(world, horn);
  Body.setVelocity(horn, {x:dir.x*34, y:dir.y*34});
  Body.setVelocity(b, {x:v.x-dir.x*4.5, y:v.y-dir.y*4.5});
  current.used = true;
  SFX.horn();
  pushText(b.position.x, b.position.y-40, '뿔 발사!', '#dbe4f0');
}

/* ============================================================
   충돌 · 데미지
   ============================================================ */
function impactEnergy(a, b){
  var rv = Vector.sub(a.velocity, b.velocity);
  var sp = Vector.magnitude(rv);
  var ma = a.isStatic ? 900 : a.mass;
  var mb = b.isStatic ? 900 : b.mass;
  var mr = (ma*mb)/(ma+mb);
  return 0.5*mr*sp*sp;
}
function killBlock(b){
  if(b.gd.dead) return;
  b.gd.dead=true;
  score += 120;
  var m = MAT[b.gd.mat];
  if(b.gd.mat==='tnt'){
    boomQueue.push({x:b.position.x, y:b.position.y});
  } else if(b.gd.mat==='glass') SFX.glass();
  else if(b.gd.mat==='stone') SFX.stone();
  else SFX.wood();
  spawnDebris(b.position.x, b.position.y, m.fill, b.gd.mat==='stone'?16:12);
  removeQueue.push(b);
  shake = Math.max(shake, 5);
}
function killSnail(s){
  if(s.gd.dead) return;
  s.gd.dead=true;
  score += 1400;
  SFX.snail();
  spawnDebris(s.position.x, s.position.y, '#8ed36a', 16);
  pushText(s.position.x, s.position.y-26, '+1400', '#ffe36b');
  removeQueue.push(s);
  shake = Math.max(shake, 7);
  flashT = 0.12;
}
function damageBlock(b, e){
  if(b.gd.dead) return;
  if(e < 18) return;
  b.gd.hp -= (e-18)*0.13;
  if(b.gd.hp<=0) killBlock(b);
  else if(e>50) SFX.hit();
}
function damageSnail(s, e){
  if(s.gd.dead) return;
  if(e < 3.2) return;
  s.gd.hp -= (e-3.2)*0.42;
  if(s.gd.hp<=0) killSnail(s);
}

/* ---------- TNT 폭발 (연쇄 가능) ---------- */
var BOOM_R = 200;
function doExplosion(x,y){
  SFX.boom();
  shake = Math.max(shake, 16); flashT = 0.22;
  for(var i=0;i<26;i++) spawnDebris(x,y, i%2?'#ffd34a':'#e8552f', 1);
  var all = Composite.allBodies(world);
  for(var k=0;k<all.length;k++){
    var b=all[k];
    if(b.isStatic) continue;
    var dx=b.position.x-x, dy=b.position.y-y;
    var d=Math.hypot(dx,dy);
    if(d>BOOM_R) continue;
    var f=1-d/BOOM_R, n=d||1;
    Body.setVelocity(b, { x:b.velocity.x + dx/n*24*f,
                          y:b.velocity.y + dy/n*24*f - 6*f });
    if(b.label==='block'||b.label==='tnt'){
      if(b.gd && !b.gd.dead){ b.gd.hp -= 85*f; if(b.gd.hp<=0) killBlock(b); }
    } else if(b.label==='snail'){
      if(b.gd && !b.gd.dead){ b.gd.hp -= 20*f; if(b.gd.hp<=0) killSnail(b); }
    }
  }
}
function onCollision(pairs){
  for(var i=0;i<pairs.length;i++){
    var p=pairs[i], a=p.bodyA, b=p.bodyB;
    var e = impactEnergy(a,b);
    if(e<2) continue;
    [ [a,b], [b,a] ].forEach(function(pair){
      var t=pair[0];
      if(t.label==='block'||t.label==='tnt') damageBlock(t, e);
      else if(t.label==='snail') damageSnail(t, e);
    });
    // 파란버섯 점프
    if(current && current.launched && !current.used && current.def.key==='blue'){
      var cb=current.body;
      if((a===cb||b===cb) && cb.velocity.y > -0.5){
        current.used = true;
        var vx = cb.velocity.x;
        // 대각선 '위 + 앞' 으로 확실하게 튀어오르게 (벽에 맞고 뒤로 튕겨도 앞으로 간다)
        var nv = { x: Math.max(8.5, Math.abs(vx)*1.15), y: -17.5 };
        Body.setVelocity(cb, nv);
        current.jumpV = { vx:nv.x, vy:nv.y, m:cb.mass };
        SFX.jump();
        pushText(cb.position.x, cb.position.y-38, '점프!', '#9fd0ff');
      }
    }
  }
}

/* ============================================================
   파티클
   ============================================================ */
function spawnDebris(x,y,color,n){
  for(var i=0;i<n;i++){
    debris.push({ x:x, y:y, vx:(Math.random()-0.5)*9, vy:-Math.random()*8-1,
                  s:2+Math.random()*5, c:color, life:1, rot:Math.random()*6, vr:(Math.random()-0.5)*0.5 });
  }
}
function pushText(x,y,t,c){ texts.push({x:x,y:y,t:t,c:c,life:1}); }

/* ============================================================
   승패
   ============================================================ */
function aliveSnails(){ var n=0; for(var i=0;i<snails.length;i++) if(!snails[i].gd.dead) n++; return n; }
function checkEnd(force){
  if(state==='won'||state==='lost') return;
  if(aliveSnails()===0){
    var left = Math.max(0, queue.length-1);
    score += left*5200;
    state='won'; SFX.win();
    // 기록 저장은 퀴즈를 통과한 뒤에 (quizPass)
    return;
  }
  if(force){ state='lost'; SFX.lose(); }
}
function starsFor(sc){
  var p=levelDef.par;
  if(sc>=p[0]) return 3; if(sc>=p[1]) return 2; if(sc>=p[2]) return 1; return 1;
}

/* ============================================================
   메인 루프
   ============================================================ */
var lastT=0;
function tick(t){
  requestAnimationFrame(tick);
  var dt = Math.min(0.05, (t-lastT)/1000 || 0.016); lastT=t;
  resize();
  if(state==='hoop'){ if(HP){ hoopTick(dt); hoopRender(); } return; }
  if(state!=='title' && state!=='select'){
    stepPhysics(dt);
  }
  render(dt);
}

/* 실시간 dt 를 SPEED 배로 눌러서 고정 스텝으로 진행 — 물리 튜닝값은 그대로 두고 속도만 느리게 */
function stepPhysics(dt){
  physAcc += dt*SPEED;
  var n=0;
  while(physAcc >= 1/60 && n<4){ physAcc -= 1/60; simStep(1/60); n++; }
  if(n===0 && dt>0) camX += (camTargetX-camX)*Math.min(1, dt*5.2);
}

function camBounds(){
  var w = levelDef ? levelDef.w : 1500;
  var lo = Math.min(0, (w-viewW)/2);
  var hi = Math.max(lo, w-viewW);
  return [lo,hi];
}

function simStep(dt){
  Engine.update(engine, 1000/60);
  if(introT>0){ introT-=dt; }
  // TNT 폭발 (연쇄는 다음 스텝으로 넘겨 스택 폭주 방지)
  if(boomQueue.length){
    var bq = boomQueue.slice(); boomQueue.length=0;
    for(var q=0;q<bq.length && q<8;q++) doExplosion(bq[q].x, bq[q].y);
  }
  // 지연 제거
  if(removeQueue.length){
    for(var i=0;i<removeQueue.length;i++) Composite.remove(world, removeQueue[i]);
    removeQueue.length=0;
  }
  // 파티클
  for(var i=debris.length-1;i>=0;i--){
    var d=debris[i]; d.vy+=0.45; d.x+=d.vx; d.y+=d.vy; d.rot+=d.vr; d.life-=dt*0.85;
    if(d.y>GROUND_Y-2){ d.y=GROUND_Y-2; d.vy*=-0.34; d.vx*=0.7; }
    if(d.life<=0) debris.splice(i,1);
  }
  for(i=texts.length-1;i>=0;i--){ texts[i].y-=0.6; texts[i].life-=dt*0.8; if(texts[i].life<=0) texts.splice(i,1); }
  if(shake>0) shake=Math.max(0, shake-dt*22);
  if(flashT>0) flashT-=dt;

  // 낙하 사망
  for(i=0;i<snails.length;i++){
    var s=snails[i];
    if(!s.gd.dead && (s.position.y>GROUND_Y+240 || s.position.x<-200 || s.position.x>levelDef.w+200)){
      s.gd.dead=true; score+=1400; SFX.snail(); removeQueue.push(s);
    }
  }

  if(state==='flying' && current){
    var b=current.body;
    trail.push({x:b.position.x, y:b.position.y});
    if(trail.length>240) trail.shift();
    camTargetX = b.position.x - viewW*0.42;
    // 지면에서 구르는 것 감쇠 (앵그리버드처럼 금방 멈추게)
    if(b.position.y > GROUND_Y - current.def.r - 6){
      Body.setVelocity(b, {x:b.velocity.x*0.955, y:b.velocity.y});
      Body.setAngularVelocity(b, b.angularVelocity*0.93);
    }
    current.flyT = (current.flyT||0) + dt;
    var sp = Math.hypot(b.velocity.x, b.velocity.y);
    if(sp < 0.42) current.restT += dt; else current.restT = 0;
    var off = b.position.y>GROUND_Y+300 || b.position.x<-150 || b.position.x>levelDef.w+150;
    if(current.restT>0.7 || off || current.flyT>7){
      if(current.def.key==='zombie' && !current.zombieSpent && !off){
        current.zombieSpent=true; current.used=true;
        current.zombieReady=true;
        Body.setStatic(b, true);
        current.zAnchor = { x:b.position.x, y:b.position.y };
        state='zombieAim';
        camTargetX = b.position.x - viewW*0.42;
        SFX.revive();
        pushText(b.position.x, b.position.y-40, '부활!', '#c9b6ff');
      } else {
        removeQueue.push(b); current=null;
        settleT=0; state='settling';
      }
    }
  } else if(state==='aim'||state==='drag'){
    if(introT>0 && !panning){
      var cbA = camBounds();
      camTargetX = (introT>0.55)? Math.max(cbA[0],Math.min(cbA[1],introTarget)) : cbA[0];
    }
  } else if(state==='settling'){
    settleT+=dt;
    camTargetX = 0;
    if(aliveSnails()===0){ checkEnd(false); }
    else if(settleT>1.3){
      queue.shift();
      if(queue.length===0) checkEnd(true); else loadNext();
    }
  }

  // 카메라
  var cb = camBounds();
  camTargetX = Math.max(cb[0], Math.min(cb[1], camTargetX));
  camX += (camTargetX-camX) * Math.min(1, dt*5.2);
  camX = Math.max(cb[0], Math.min(cb[1], camX));
}

/* ---------- 줌 ---------- */
function setZoom(z){
  z = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z));
  if(Math.abs(z-zoom)<0.0005) return;
  var cx = camX + viewW/2;
  zoom = z; resize();
  var b = camBounds();
  camX = Math.max(b[0], Math.min(b[1], cx - viewW/2));
  camTargetX = camX; introT = 0;
}
function fitAll(){
  if(!levelDef) return;
  setZoom(canvas.width / ((levelDef.w+120) * baseScale));
  var b = camBounds();
  camX = camTargetX = Math.max(b[0], Math.min(b[1], (levelDef.w - viewW)/2));
}

/* ============================================================
   입력
   ============================================================ */
function toWorld(ev){
  var r=canvas.getBoundingClientRect();
  var cx=(ev.clientX-r.left)/r.width*canvas.width;
  var cy=(ev.clientY-r.top)/r.height*canvas.height;
  return { x: cx/scale + camX, y: cy/scale + camY };
}
function anchorPoint(){
  if((state==='zombieAim'||state==='zombieDrag') && current && current.zAnchor)
    return { x:current.zAnchor.x, y:current.zAnchor.y };
  return {x:SLING_X, y:SLING_Y};
}
function startPinch(){
  pinching = true;
  var k=Object.keys(ptrs), a=ptrs[k[0]], b=ptrs[k[1]];
  pinchD0 = Math.max(20, Math.hypot(a.x-b.x, a.y-b.y));
  pinchZ0 = zoom;
  if(dragging){ dragging=false;
    if(current && !current.launched) Body.setPosition(current.body, anchorPoint());
    state = (state==='zombieDrag')? 'zombieAim' : 'aim';
    pull={x:0,y:0};
  }
  panning=false;
}
function updatePinch(){
  var k=Object.keys(ptrs); if(k.length<2) return;
  var a=ptrs[k[0]], b=ptrs[k[1]];
  var d=Math.max(20, Math.hypot(a.x-b.x, a.y-b.y));
  setZoom(pinchZ0 * (d/pinchD0));
}
function onDown(ev){
  if(state==='hoop'){ if(HP) hoopDown(ev); return; }
  ptrs[ev.pointerId]={x:ev.clientX,y:ev.clientY};
  if(Object.keys(ptrs).length>=2){ startPinch(); try{canvas.setPointerCapture(ev.pointerId);}catch(e){} return; }
  if(state==='flying'){ tapAbility(); return; }
  if(state!=='aim' && state!=='zombieAim') return;
  if(introT>0){ introT=0; camTargetX=0; }
  var p=toWorld(ev), a=anchorPoint();
  if(Math.hypot(p.x-a.x, p.y-a.y) > 150){
    panning=true; panStartClientX=ev.clientX; panCamX=camX; introT=0;
    try{ canvas.setPointerCapture(ev.pointerId); }catch(e){}
    return;
  }
  dragging=true; state = (state==='zombieAim') ? 'zombieDrag' : 'drag';
  updatePull(p);
  try{ canvas.setPointerCapture(ev.pointerId); }catch(e){}
}
function onMove(ev){
  if(state==='hoop'){ if(HP) hoopMove(ev); return; }
  if(ptrs[ev.pointerId]) ptrs[ev.pointerId]={x:ev.clientX,y:ev.clientY};
  if(pinching){ updatePinch(); return; }
  if(panning){
    var r=canvas.getBoundingClientRect();
    var d=(panStartClientX-ev.clientX)*(canvas.width/r.width)/scale;
    var mx=Math.max(0, levelDef.w-viewW);
    camTargetX = Math.max(0, Math.min(mx, panCamX+d));
    camX = camTargetX;
    return;
  }
  if(!dragging) return;
  updatePull(toWorld(ev));
}
function updatePull(p){
  var a=anchorPoint();
  var dx=p.x-a.x, dy=p.y-a.y;
  var d=Math.hypot(dx,dy);
  if(d>MAX_PULL){ dx=dx/d*MAX_PULL; dy=dy/d*MAX_PULL; d=MAX_PULL; }
  var prev=Math.hypot(pull.x,pull.y);
  pull={x:dx,y:dy};
  if(Math.abs(d-prev)>14) SFX.stretch();
  if(current && state==='drag') Body.setPosition(current.body, {x:a.x+dx, y:a.y+dy});
}
function onUp(ev){
  if(state==='hoop'){ if(HP) hoopUp(); return; }
  delete ptrs[ev.pointerId];
  if(pinching){ if(Object.keys(ptrs).length<2) pinching=false; return; }
  if(panning){ panning=false; return; }
  if(!dragging) return;
  dragging=false;
  var a=anchorPoint();
  var d=Math.hypot(pull.x,pull.y);
  if(d<14){
    if(current && !current.launched) Body.setPosition(current.body, a);
    state = (state==='zombieDrag') ? 'zombieAim' : 'aim';
    pull={x:0,y:0};
    return;
  }
  var isZ = (state==='zombieDrag');
  var k = isZ ? VEL_K*0.86 : VEL_K;
  var from = isZ ? {x:a.x, y:a.y} : {x:a.x+pull.x, y:a.y+pull.y};
  var vec = { x:-pull.x*k, y:-pull.y*k };
  if(isZ){
    var b=current.body;
    Body.setStatic(b,false);
    Body.setPosition(b, from);
    Body.setVelocity(b, vec);
    Body.setAngularVelocity(b,(Math.random()-0.5)*0.4);
    state='flying'; current.restT=0; current.flyT=0; lastTrail=trail.slice(); trail=[];
    SFX.launch();
  } else {
    launch(from, vec);
  }
  pull={x:0,y:0};
}

/* ============================================================
   크기 조정
   ============================================================ */
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  var w = Math.floor(canvas.clientWidth*DPR), h = Math.floor(canvas.clientHeight*DPR);
  if(canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h; }
  baseScale = Math.min(canvas.height/VIEW_H, canvas.width/MIN_VIEW_W);
  scale = baseScale * zoom;
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  camY  = GROUND_Y + 40 - viewH;
}

/* ============================================================
   그리기 — 모든 캐릭터·배경은 코드로 그린 오리지널 도형
   ============================================================ */
function rr(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath();
}

/* ---------- 버섯 ---------- */
function drawShroom(c, def, R, angry, shout){
  // 그림자
  c.save();
  c.fillStyle='rgba(0,0,0,0.14)';
  c.beginPath(); c.ellipse(0, R*0.92, R*0.82, R*0.2, 0,0,7); c.fill();
  c.restore();

  // 몸통
  var bw=R*1.16, bh=R*1.08;
  var bg=c.createLinearGradient(0,-bh*0.2,0,bh);
  bg.addColorStop(0,'#fdf6e8'); bg.addColorStop(1,'#e6d6b8');
  c.fillStyle=bg;
  c.beginPath();
  c.moveTo(-bw*0.5,-bh*0.1);
  c.bezierCurveTo(-bw*0.62, bh*0.62, -bw*0.40, bh*0.94, 0, bh*0.94);
  c.bezierCurveTo( bw*0.40, bh*0.94,  bw*0.62, bh*0.62,  bw*0.5,-bh*0.1);
  c.closePath(); c.fill();
  c.strokeStyle='rgba(150,120,80,0.45)'; c.lineWidth=R*0.07; c.stroke();

  // 발
  c.fillStyle='#d9c4a0';
  c.beginPath(); c.ellipse(-R*0.34, bh*0.9, R*0.24, R*0.12,0,0,7); c.fill();
  c.beginPath(); c.ellipse( R*0.34, bh*0.9, R*0.24, R*0.12,0,0,7); c.fill();

  // 갓
  var cw=R*1.5, ch=R*0.98;
  var cg=c.createLinearGradient(-cw*0.3,-ch,cw*0.4,ch*0.2);
  cg.addColorStop(0,def.cap); cg.addColorStop(1,def.cap2);
  c.fillStyle=cg;
  c.beginPath();
  c.moveTo(-cw, -R*0.02);
  c.bezierCurveTo(-cw*0.98,-ch*1.28, cw*0.98,-ch*1.28, cw,-R*0.02);
  // 물결 밑단
  var seg=5;
  for(var i=seg;i>=1;i--){
    var x1=-cw+(2*cw)*(i/seg), x0=-cw+(2*cw)*((i-1)/seg);
    c.quadraticCurveTo((x0+x1)/2, R*0.16, x0, -R*0.02);
  }
  c.closePath(); c.fill();
  c.strokeStyle='rgba(0,0,0,0.20)'; c.lineWidth=R*0.07; c.stroke();

  // 갓 무늬 (원형 반점)
  c.fillStyle=def.spot; c.globalAlpha=0.9;
  c.beginPath(); c.ellipse(-cw*0.45,-ch*0.52, R*0.20, R*0.15, -0.3,0,7); c.fill();
  c.beginPath(); c.ellipse( cw*0.30,-ch*0.62, R*0.16, R*0.12,  0.2,0,7); c.fill();
  c.beginPath(); c.ellipse( cw*0.05,-ch*0.28, R*0.12, R*0.09,  0,0,7); c.fill();
  c.globalAlpha=1;
  // 갓 하이라이트
  c.fillStyle='rgba(255,255,255,0.22)';
  c.beginPath(); c.ellipse(-cw*0.30,-ch*0.80, R*0.40, R*0.15, -0.35,0,7); c.fill();

  // 얼굴
  var ey=R*0.34, ex=R*0.38;
  c.fillStyle='#3b2c22';
  c.beginPath(); c.ellipse(-ex, ey, R*0.15, R*0.20, 0,0,7); c.fill();
  c.beginPath(); c.ellipse( ex, ey, R*0.15, R*0.20, 0,0,7); c.fill();
  c.fillStyle='#fff';
  c.beginPath(); c.arc(-ex+R*0.05, ey-R*0.07, R*0.055,0,7); c.fill();
  c.beginPath(); c.arc( ex+R*0.05, ey-R*0.07, R*0.055,0,7); c.fill();
  // 눈썹
  c.strokeStyle='#3b2c22'; c.lineWidth=R*0.11; c.lineCap='round';
  if(angry){
    c.beginPath(); c.moveTo(-ex-R*0.20, ey-R*0.34); c.lineTo(-ex+R*0.16, ey-R*0.15); c.stroke();
    c.beginPath(); c.moveTo( ex+R*0.20, ey-R*0.34); c.lineTo( ex-R*0.16, ey-R*0.15); c.stroke();
  }
  // 입
  c.strokeStyle='#3b2c22'; c.lineWidth=R*0.09;
  if(shout){
    c.fillStyle='#8c4a44';
    c.beginPath(); c.ellipse(0, ey+R*0.44, R*0.17, R*0.21, 0,0,7); c.fill();
  } else {
    c.beginPath(); c.arc(0, ey+R*0.30, R*0.17, 0.25*Math.PI, 0.75*Math.PI); c.stroke();
  }
  // 볼
  c.fillStyle='rgba(240,140,130,0.35)';
  c.beginPath(); c.ellipse(-ex-R*0.26, ey+R*0.22, R*0.14, R*0.09,0,0,7); c.fill();
  c.beginPath(); c.ellipse( ex+R*0.26, ey+R*0.22, R*0.14, R*0.09,0,0,7); c.fill();

  // 뿔버섯의 뿔
  if(def.key==='horn'){
    c.fillStyle='#f2f0e4'; c.strokeStyle='rgba(0,0,0,0.25)'; c.lineWidth=R*0.06;
    c.beginPath(); c.moveTo(cw*0.55,-ch*0.55); c.lineTo(cw*1.18,-ch*0.72); c.lineTo(cw*0.58,-ch*0.20); c.closePath();
    c.fill(); c.stroke();
  }
  // 좀비버섯 부적
  if(def.key==='zombie'){
    c.fillStyle='#fbf3c8'; c.strokeStyle='#b04040'; c.lineWidth=R*0.05;
    c.save(); c.translate(0,-ch*0.72); c.rotate(-0.08);
    rr(c,-R*0.15,-R*0.30,R*0.30,R*0.62,R*0.05); c.fill(); c.stroke();
    c.restore();
  }
  // 왕버섯 왕관
  if(def.key==='king'){
    c.fillStyle='#ffd24a'; c.strokeStyle='#c99516'; c.lineWidth=R*0.05;
    c.beginPath();
    c.moveTo(-R*0.42,-ch*1.02); c.lineTo(-R*0.42,-ch*1.34); c.lineTo(-R*0.14,-ch*1.14);
    c.lineTo(0,-ch*1.44); c.lineTo(R*0.14,-ch*1.14); c.lineTo(R*0.42,-ch*1.34);
    c.lineTo(R*0.42,-ch*1.02); c.closePath(); c.fill(); c.stroke();
  }
}

/* ---------- 달팽이 병사 ---------- */
function drawSnail(c, R, hurt, blink){
  c.save();
  c.fillStyle='rgba(0,0,0,0.15)';
  c.beginPath(); c.ellipse(0,R*0.95,R*0.9,R*0.2,0,0,7); c.fill();
  c.restore();

  // 몸
  var bg=c.createLinearGradient(0,-R*0.2,0,R);
  bg.addColorStop(0,'#bdf09a'); bg.addColorStop(1,'#6fae52');
  c.fillStyle=bg;
  c.beginPath();
  c.moveTo(-R*1.25, R*0.9);
  c.quadraticCurveTo(-R*1.5, R*0.1, -R*0.85,-R*0.15);
  c.quadraticCurveTo(-R*0.2,-R*0.5, R*0.55,-R*0.1);
  c.quadraticCurveTo(R*1.25, R*0.3, R*1.15, R*0.9);
  c.closePath(); c.fill();
  c.strokeStyle='rgba(60,90,40,0.5)'; c.lineWidth=R*0.08; c.stroke();

  // 껍데기 (나선)
  c.save();
  c.translate(R*0.28, R*0.05);
  var sg=c.createRadialGradient(-R*0.2,-R*0.2,R*0.1, 0,0,R*0.95);
  sg.addColorStop(0,'#f3c76a'); sg.addColorStop(1,'#a9702c');
  c.fillStyle=sg;
  c.beginPath(); c.arc(0,0,R*0.88,0,7); c.fill();
  c.strokeStyle='#7d4d18'; c.lineWidth=R*0.10; c.stroke();
  c.strokeStyle='rgba(120,70,20,0.75)'; c.lineWidth=R*0.11; c.lineCap='round';
  c.beginPath();
  for(var i=0;i<=54;i++){
    var t=i/54*Math.PI*3.1, rad=R*0.80*(1-i/54*0.92);
    var px=Math.cos(t)*rad, py=Math.sin(t)*rad;
    if(i===0) c.moveTo(px,py); else c.lineTo(px,py);
  }
  c.stroke();
  c.restore();

  // 눈자루
  c.strokeStyle='#6fae52'; c.lineWidth=R*0.15; c.lineCap='round';
  c.beginPath(); c.moveTo(-R*0.75,-R*0.12); c.quadraticCurveTo(-R*1.05,-R*0.85,-R*0.86,-R*1.10); c.stroke();
  c.beginPath(); c.moveTo(-R*0.50,-R*0.20); c.quadraticCurveTo(-R*0.55,-R*0.90,-R*0.34,-R*1.06); c.stroke();
  c.fillStyle='#f4fff0';
  c.beginPath(); c.arc(-R*0.86,-R*1.18,R*0.23,0,7); c.fill();
  c.beginPath(); c.arc(-R*0.34,-R*1.14,R*0.23,0,7); c.fill();
  c.fillStyle='#2c2118';
  if(blink){
    c.strokeStyle='#2c2118'; c.lineWidth=R*0.09;
    c.beginPath(); c.moveTo(-R*1.0,-R*1.18); c.lineTo(-R*0.72,-R*1.18); c.stroke();
    c.beginPath(); c.moveTo(-R*0.48,-R*1.14); c.lineTo(-R*0.20,-R*1.14); c.stroke();
  } else {
    c.beginPath(); c.arc(-R*0.90,-R*1.20,R*0.10,0,7); c.fill();
    c.beginPath(); c.arc(-R*0.38,-R*1.16,R*0.10,0,7); c.fill();
  }
  // 성난 눈썹
  c.strokeStyle='#2c2118'; c.lineWidth=R*0.10;
  c.beginPath(); c.moveTo(-R*1.14,-R*1.50); c.lineTo(-R*0.70,-R*1.34); c.stroke();
  c.beginPath(); c.moveTo(-R*0.10,-R*1.46); c.lineTo(-R*0.52,-R*1.32); c.stroke();
  // 왕국 투구
  c.fillStyle='#b9c6d4'; c.strokeStyle='#76838f'; c.lineWidth=R*0.07;
  c.beginPath(); c.arc(R*0.28,-R*0.72, R*0.42, Math.PI*1.05, Math.PI*1.95); c.closePath(); c.fill(); c.stroke();
  c.fillStyle='#d9534f';
  c.beginPath(); c.ellipse(R*0.28,-R*1.16, R*0.10, R*0.26, 0,0,7); c.fill();

  if(hurt){ c.fillStyle='rgba(255,80,80,'+hurt+')'; c.beginPath(); c.arc(0,0,R*1.4,0,7); c.fill(); }
}

/* ---------- 블록 ---------- */
function drawBlock(c, b){
  var gd=b.gd, m=MAT[gd.mat], w=gd.w, h=gd.h;
  var ratio = Math.max(0, gd.hp/gd.maxhp);

  /* --- 삼각 지붕 --- */
  if(gd.shape==='tri'){
    var vs=b.vertices;
    c.save();
    c.beginPath(); c.moveTo(vs[0].x, vs[0].y);
    for(var vi=1; vi<vs.length; vi++) c.lineTo(vs[vi].x, vs[vi].y);
    c.closePath();
    var cxx=b.position.x, cyy=b.position.y;
    var tg=c.createLinearGradient(cxx,cyy-h/2,cxx,cyy+h/2);
    if(gd.mat==='stone'){ tg.addColorStop(0,'#b3bcc5'); tg.addColorStop(1,'#7c858e'); }
    else { tg.addColorStop(0,'#d69a55'); tg.addColorStop(1,'#a97137'); }
    c.fillStyle=tg; c.fill();
    c.strokeStyle=m.edge; c.lineWidth=2.5; c.stroke();
    c.save(); c.clip();
    c.strokeStyle='rgba(255,255,255,0.18)'; c.lineWidth=3;
    c.translate(cxx,cyy); c.rotate(b.angle);
    for(var ti=-3; ti<=3; ti++){
      c.beginPath(); c.moveTo(-w/2, h/2 - (ti+3)*h/6); c.lineTo(w/2, h/2 - (ti+3)*h/6); c.stroke();
    }
    c.restore();
    if(ratio<0.8){
      c.strokeStyle='rgba(40,25,10,'+(0.3+(1-ratio)*0.5)+')'; c.lineWidth=2;
      c.beginPath(); c.moveTo(cxx-w*0.2, cyy+h*0.4); c.lineTo(cxx+w*0.05, cyy-h*0.1); c.stroke();
    }
    c.restore();
    return;
  }

  /* --- TNT --- */
  if(gd.mat==='tnt'){
    c.save();
    c.translate(b.position.x, b.position.y); c.rotate(b.angle);
    var pulse = 0.5+Math.sin(Date.now()*0.006)*0.5;
    var bgd=c.createLinearGradient(-w/2,0,w/2,0);
    bgd.addColorStop(0,'#a8332c'); bgd.addColorStop(0.45,'#e05a4c'); bgd.addColorStop(1,'#9c2c25');
    c.fillStyle=bgd; rr(c,-w/2,-h/2,w,h,5); c.fill();
    c.strokeStyle='#6d1d18'; c.lineWidth=2.5; c.stroke();
    c.fillStyle='#f3e6c8';
    c.fillRect(-w/2+2,-h*0.18, w-4, h*0.34);
    c.fillStyle='#8c2b22'; c.textAlign='center'; c.textBaseline='middle';
    c.font='bold 15px "Noto Sans KR", sans-serif';
    c.fillText('TNT', 0, h*0.01);
    c.textBaseline='alphabetic';
    c.strokeStyle='#5c4630'; c.lineWidth=3; c.lineCap='round';
    c.beginPath(); c.moveTo(0,-h/2); c.quadraticCurveTo(7,-h/2-9, 2,-h/2-15); c.stroke();
    c.fillStyle='rgba(255,'+Math.round(150+pulse*90)+',60,'+(0.6+pulse*0.4)+')';
    c.beginPath(); c.arc(2,-h/2-16, 3.4+pulse*2.2, 0,7); c.fill();
    if(ratio<0.7){
      c.strokeStyle='rgba(20,10,5,0.5)'; c.lineWidth=1.8;
      c.beginPath(); c.moveTo(-w*0.3,-h/2); c.lineTo(w*0.1,h/2); c.stroke();
    }
    c.restore();
    return;
  }

  c.save();
  c.translate(b.position.x, b.position.y); c.rotate(b.angle);
  if(gd.mat==='glass'){
    c.globalAlpha=0.72;
    var gg=c.createLinearGradient(-w/2,-h/2,w/2,h/2);
    gg.addColorStop(0,'#cdf2fb'); gg.addColorStop(0.5,'#8fd8ee'); gg.addColorStop(1,'#bfeafa');
    c.fillStyle=gg; rr(c,-w/2,-h/2,w,h,3); c.fill();
    c.globalAlpha=1;
    c.strokeStyle=m.edge; c.lineWidth=2; c.stroke();
    c.strokeStyle='rgba(255,255,255,0.75)'; c.lineWidth=Math.max(2,Math.min(w,h)*0.12);
    c.beginPath(); c.moveTo(-w/2+w*0.18,-h/2+h*0.10); c.lineTo(-w/2+w*0.34,h/2-h*0.12); c.stroke();
  } else if(gd.mat==='stone'){
    var sg=c.createLinearGradient(0,-h/2,0,h/2);
    sg.addColorStop(0,'#b3bcc5'); sg.addColorStop(1,'#7c858e');
    c.fillStyle=sg; rr(c,-w/2,-h/2,w,h,4); c.fill();
    c.strokeStyle=m.edge; c.lineWidth=2.5; c.stroke();
    c.fillStyle='rgba(255,255,255,0.18)';
    for(var i=0;i<6;i++){
      var sx=((i*37)%100)/100*w-w/2, sy=((i*61)%100)/100*h-h/2;
      c.beginPath(); c.arc(sx,sy,1.6+((i*13)%3),0,7); c.fill();
    }
    c.strokeStyle='rgba(80,88,96,0.5)'; c.lineWidth=1.4;
    if(h>w){ for(var j=1;j<Math.floor(h/34)+1;j++){ var yy=-h/2+j*34; c.beginPath(); c.moveTo(-w/2+2,yy); c.lineTo(w/2-2,yy); c.stroke(); } }
    else { for(var j2=1;j2<Math.floor(w/40)+1;j2++){ var xx=-w/2+j2*40; c.beginPath(); c.moveTo(xx,-h/2+2); c.lineTo(xx,h/2-2); c.stroke(); } }
  } else {
    var wg=c.createLinearGradient(0,-h/2,0,h/2);
    wg.addColorStop(0,'#d69a55'); wg.addColorStop(1,'#a97137');
    c.fillStyle=wg; rr(c,-w/2,-h/2,w,h,4); c.fill();
    c.strokeStyle=m.edge; c.lineWidth=2.5; c.stroke();
    c.strokeStyle='rgba(120,74,30,0.45)'; c.lineWidth=1.5;
    if(h>w){ for(var k=0;k<3;k++){ var gx=-w/2+w*(0.28+k*0.22);
        c.beginPath(); c.moveTo(gx,-h/2+4); c.bezierCurveTo(gx+3,-h/6,gx-3,h/6,gx,h/2-4); c.stroke(); } }
    else { for(var k2=0;k2<3;k2++){ var gy=-h/2+h*(0.28+k2*0.22);
        c.beginPath(); c.moveTo(-w/2+4,gy); c.bezierCurveTo(-w/6,gy+3,w/6,gy-3,w/2-4,gy); c.stroke(); } }
  }
  // 균열
  if(ratio<0.82){
    c.strokeStyle='rgba(40,25,10,'+(0.30+(1-ratio)*0.5)+')';
    c.lineWidth=1.8; c.lineCap='round';
    var n = ratio<0.45?4:2;
    for(var q=0;q<n;q++){
      var a0=(q*97)%100/100, b0=(q*53)%100/100;
      c.beginPath();
      c.moveTo(-w/2+w*a0, -h/2);
      c.lineTo(-w/2+w*(a0*0.6+0.2), -h/2+h*0.42);
      c.lineTo(-w/2+w*b0, h/2);
      c.stroke();
    }
  }
  c.restore();
}

/* ---------- 배경 ---------- */
var CLOUDS=[];
for(var ci=0;ci<9;ci++) CLOUDS.push({x:ci*380+Math.random()*180, yf:Math.random(), s:0.55+Math.random()*0.8, sp:0.06+Math.random()*0.10});

function drawSky(c){
  var g=c.createLinearGradient(0,camY,0,GROUND_Y+40);
  g.addColorStop(0,'#7fc4e8'); g.addColorStop(0.45,'#bfe4f2'); g.addColorStop(0.82,'#eaf3d8');
  c.fillStyle=g; c.fillRect(-20,camY-40,viewW+40,(GROUND_Y+90)-(camY-40));
  // 해
  var sy=camY+viewH*0.15;
  c.save(); c.globalAlpha=0.55; c.fillStyle='#fff3b0';
  c.beginPath(); c.arc(viewW*0.80, sy, 52,0,7); c.fill();
  c.globalAlpha=0.22; c.beginPath(); c.arc(viewW*0.80,sy,86,0,7); c.fill();
  c.restore();
}
function drawClouds(c,t){
  c.save(); c.fillStyle='rgba(255,255,255,0.88)';
  for(var i=0;i<CLOUDS.length;i++){
    var cl=CLOUDS[i];
    var x=((cl.x - camX*0.22 - t*cl.sp*10) % (levelDef.w+900) + (levelDef.w+900)) % (levelDef.w+900) - 300;
    if(x<-300||x>viewW+300) continue;
    var cy2 = camY + viewH*(0.05 + cl.yf*0.36);
    c.save(); c.translate(x, cy2); c.scale(cl.s,cl.s);
    c.beginPath();
    c.arc(0,0,30,0,7); c.arc(34,-12,38,0,7); c.arc(74,2,28,0,7); c.arc(38,16,32,0,7);
    c.fill(); c.restore();
  }
  c.restore();
}
function drawHills(c){
  // 원경
  c.save(); c.translate(-camX*0.28,0);
  c.fillStyle='#9fc4a8';
  c.beginPath(); c.moveTo(-400, GROUND_Y);
  for(var x=-400;x<=levelDef.w+600;x+=120){
    c.quadraticCurveTo(x+60, GROUND_Y-150-Math.sin(x*0.004)*70, x+120, GROUND_Y-70-Math.cos(x*0.003)*40);
  }
  c.lineTo(levelDef.w+700, GROUND_Y+120); c.lineTo(-400, GROUND_Y+120); c.closePath(); c.fill();
  c.restore();
  // 달팽이 왕성 실루엣
  c.save(); c.translate(-camX*0.5,0);
  c.fillStyle='rgba(120,142,162,0.38)';
  var bx=levelDef.w*0.62;
  for(var i=0;i<4;i++){
    var tx=bx+i*130, th=210+((i%2)*80);
    c.fillRect(tx, GROUND_Y-th, 74, th);
    c.beginPath(); c.moveTo(tx-12,GROUND_Y-th); c.lineTo(tx+37,GROUND_Y-th-56); c.lineTo(tx+86,GROUND_Y-th); c.closePath(); c.fill();
  }
  c.fillRect(bx-40, GROUND_Y-150, 600, 150);
  c.restore();
  // 근경 언덕
  c.save(); c.translate(-camX*0.62,0);
  c.fillStyle='#7fae74';
  c.beginPath(); c.moveTo(-400,GROUND_Y+20);
  for(var x2=-400;x2<=levelDef.w+600;x2+=180) c.quadraticCurveTo(x2+90, GROUND_Y-90, x2+180, GROUND_Y+10);
  c.lineTo(levelDef.w+700,GROUND_Y+120); c.lineTo(-400,GROUND_Y+120); c.closePath(); c.fill();
  c.restore();
}
function drawGround(c){
  c.fillStyle='#7a5a34'; c.fillRect(-400, GROUND_Y, levelDef.w+900, WORLD_H-GROUND_Y+200);
  var g=c.createLinearGradient(0,GROUND_Y,0,GROUND_Y+44);

  c.beginPath(); c.moveTo(-400,GROUND_Y+1.5); c.lineTo(levelDef.w+500,GROUND_Y+1.5); c.stroke();
  c.fillStyle='rgba(60,42,22,0.35)';
  for(var i=0;i<90;i++){
    var x=(i*137)%(levelDef.w+600)-300, y=GROUND_Y+48+((i*71)%60);
    c.beginPath(); c.ellipse(x,y,7+((i*31)%9),4,0,0,7); c.fill();
  }
  // 풀
  c.strokeStyle='#4f8f36'; c.lineWidth=2.4; c.lineCap='round';

    var gx=j*26-300;

function drawSling(c, front){
  var bx=SLING_X, by=GROUND_Y;
  if(!front){
    c.save();
    c.strokeStyle='#8b5e30'; c.lineCap='round';
    c.lineWidth=17;
    c.beginPath(); c.moveTo(bx, by); c.lineTo(bx, SLING_Y+16); c.stroke();
    c.lineWidth=13;
    c.beginPath(); c.moveTo(bx, SLING_Y+22); c.lineTo(bx-22, SLING_Y-12); c.stroke();
    c.beginPath(); c.moveTo(bx, SLING_Y+22); c.lineTo(bx+22, SLING_Y-12); c.stroke();
    c.strokeStyle='rgba(255,255,255,0.18)'; c.lineWidth=4;
    c.beginPath(); c.moveTo(bx-4, by-6); c.lineTo(bx-4, SLING_Y+20); c.stroke();

function drawBands(c, front){
  if(state!=='aim'&&state!=='drag') return;
  if(!current||current.launched) return;
  var p=current.body.position;
  c.save();
  c.strokeStyle= front? '#4a2c14' : '#6b3f1d';
  c.lineWidth=9; c.lineCap='round';
  c.beginPath();
  if(front){ c.moveTo(SLING_X+22, SLING_Y-12); } else { c.moveTo(SLING_X-22, SLING_Y-12); }
  c.lineTo(p.x, p.y); c.stroke();
  c.restore();
}

/* ============================================================
   라운드 클리어 퀴즈 — 중1 탄성력
   ('버섯동산의 비밀' 학습앱에서 다룬 개념 그대로)
   ============================================================ */
function qFmt(n){
  var r = Math.round(n*100)/100;
  return (Math.abs(r-Math.round(r))<1e-9) ? String(Math.round(r)) : String(r);
}
function qRand(a){ return a[Math.floor(Math.random()*a.length)]; }
function qShuffleIdx(n){
  var a=[]; for(var i=0;i<n;i++) a.push(i);
  for(var j=a.length-1;j>0;j--){ var k=Math.floor(Math.random()*(j+1)); var t=a[j]; a[j]=a[k]; a[k]=t; }
  return a;
}
/* 정답 + 오답들을 섞어 보기 배열과 정답 인덱스로 */
function qMix(correct, wrongs){
  var pool=[correct], i;
  for(i=0;i<wrongs.length && pool.length<4;i++){
    if(pool.indexOf(wrongs[i])<0) pool.push(wrongs[i]);
  }
  var ord = qShuffleIdx(pool.length);
  var out = ord.map(function(k){ return pool[k]; });
  return { choices: out, ans: out.indexOf(correct) };
}
function qNumChoices(v, unit, alts){
  var c = qFmt(v)+' '+unit;
  var w = alts.map(function(x){ return qFmt(x)+' '+unit; })
              .filter(function(t){ return t!==c; });
  return qMix(c, w);
}

/* ---------- 표 / 그래프 그리기 ---------- */
function qTable(xs, ys, hideIdx){
  var h = '<table class="qtab"><tr><th>늘어난 길이(cm)</th>';
  xs.forEach(function(x){ h += '<td>'+qFmt(x)+'</td>'; });
  h += '</tr><tr><th>탄성력(N)</th>';
  ys.forEach(function(y,i){ h += '<td>'+(i===hideIdx?'<b>?</b>':qFmt(y))+'</td>'; });
  return h + '</tr></table>';
}
function qGraph(k, xmax, ymax, ptCount, step, askX){
  var W=340, H=244, L=46, B=36, TOP=30, PW=W-L-14, PH=H-B-TOP;
  var sx=function(x){ return L + x/xmax*PW; };
  var sy=function(y){ return (H-B) - y/ymax*PH; };
  var s='<svg viewBox="0 0 '+W+' '+H+'" class="qsvg" role="img">';
  s+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#0f2033"/>';
  // 격자
  var gx, gy, i;
  for(i=0;i<=xmax/step;i++){
    gx=sx(i*step);
    s+='<line x1="'+gx+'" y1="'+sy(0)+'" x2="'+gx+'" y2="'+sy(ymax)+'" stroke="rgba(255,255,255,.14)"/>';
    s+='<text x="'+gx+'" y="'+(H-B+16)+'" fill="#9fc0e4" font-size="11" text-anchor="middle">'+qFmt(i*step)+'</text>';
  }
  var ystep = k*step;                       // 눈금이 깔끔한 숫자가 되도록
  while(ymax/ystep > 9) ystep *= 2;
  var nY = Math.round(ymax/ystep);
  for(i=0;i<=nY;i++){
    gy=sy(i*ystep);
    s+='<line x1="'+sx(0)+'" y1="'+gy+'" x2="'+sx(xmax)+'" y2="'+gy+'" stroke="rgba(255,255,255,.14)"/>';
    s+='<text x="'+(L-7)+'" y="'+(gy+4)+'" fill="#9fc0e4" font-size="11" text-anchor="end">'+qFmt(i*ystep)+'</text>';
  }
  // 축
  s+='<line x1="'+sx(0)+'" y1="'+sy(0)+'" x2="'+sx(xmax)+'" y2="'+sy(0)+'" stroke="#dbe9fb" stroke-width="2"/>';
  s+='<line x1="'+sx(0)+'" y1="'+sy(0)+'" x2="'+sx(0)+'" y2="'+sy(ymax)+'" stroke="#dbe9fb" stroke-width="2"/>';
  // 데이터 직선 (원점 ~ 마지막 측정점) + 점선 연장
  var lastX = ptCount*step;
  s+='<line x1="'+sx(0)+'" y1="'+sy(0)+'" x2="'+sx(lastX)+'" y2="'+sy(k*lastX)+'" stroke="#ffd76a" stroke-width="2.5"/>';
  if(lastX < xmax){
    s+='<line x1="'+sx(lastX)+'" y1="'+sy(k*lastX)+'" x2="'+sx(xmax)+'" y2="'+sy(k*xmax)+
       '" stroke="#ffd76a" stroke-width="2" stroke-dasharray="6 5" opacity="0.65"/>';
  }
  for(i=1;i<=ptCount;i++){
    s+='<circle cx="'+sx(i*step)+'" cy="'+sy(k*i*step)+'" r="4" fill="#ffd76a" stroke="#7a5510"/>';
  }
  // 물어보는 x 위치 안내선
  if(askX!=null){
    s+='<line x1="'+sx(askX)+'" y1="'+sy(0)+'" x2="'+sx(askX)+'" y2="'+sy(ymax)+
       '" stroke="#ff8f6b" stroke-width="2" stroke-dasharray="4 4"/>';
    s+='<text x="'+sx(askX)+'" y="'+(sy(ymax)-3)+'" fill="#ff8f6b" font-size="11" text-anchor="middle">'+qFmt(askX)+'cm</text>';
  }
  s+='<text x="'+(W-8)+'" y="'+(H-B+30)+'" fill="#9fc0e4" font-size="11" text-anchor="end">늘어난 길이(cm)</text>';
  s+='<text x="6" y="17" fill="#9fc0e4" font-size="11">탄성력(N)</text>';
  return s+'</svg>';
}

    mix: qNumChoices(w2, 'N', [w2*2, w2/2, x2, w2+w1]),

         qFmt(x2)+' cm ÷ '+qFmt(cmPerN)+' cm/N = <b>'+qFmt(w2)+' N</b><br>'+
         '(늘어난 길이가 '+n+'배 → 힘도 '+n+'배로 봐도 똑같아.)',
    _v:{x2:x2,w2:w2}, _ansVal:w2 };
}
};

/* 라운드별 출제 구성 — 뒤로 갈수록 계산·그래프 비중이 커짐 */
var ROUND_Q = [
  ['oxEquil',       'oxDir'],
  ['oxProp',        'calcLen2Force'],
  ['oxDir',         'calcForce2Len'],
  ['tableInterp',   'oxLimit'],
  ['calcWeight2Len','tableExtrap'],
  ['graphRead',     'calcLen2Weight'],
  ['tableInterp',   'tableExtrap'],
  ['graphExtrap',   'oxHard'],
  ['calcTwoStep',   'oxEquil'],
  ['graphExtrap',   'calcTwoStep']
];

function makeQuestion(name){
  var q = QGEN[name]();
  q.gen = name;
  if(q.kind==='ox'){
    q.choices = ['⭕ 맞다', '❌ 아니다'];
  } else {
    q.choices = q.mix.choices;
    q.ans = q.mix.ans;
  }
  return q;
}
function makeQuizFor(levelIdx){
  var names = ROUND_Q[levelIdx % ROUND_Q.length];
  return [ makeQuestion(names[0]), makeQuestion(names[1]) ];
}
/* 다시 풀 때 보기 순서 섞기 (O/X 는 그대로) */
function reshuffleQuestion(q){
  if(q.kind==='ox') return q;
  var ord = qShuffleIdx(q.choices.length);
  var correct = q.choices[q.ans];
  q.choices = ord.map(function(k){ return q.choices[k]; });
  q.ans = q.choices.indexOf(correct);
  return q;
}

/* ============================================================
   퀴즈 진행
   ============================================================ */
var QZ = null;
function qEl(id){ return document.getElementById(id); }

function startQuiz(){
  QZ = { qs: makeQuizFor(levelIdx), idx:0, res:[null,null], mode:'first', locked:false };
  show('result', false);
  show('quiz', true);
  renderQ();
}

function renderQ(){
  var q = QZ.qs[QZ.idx];
  qEl('qstep').innerHTML = (QZ.mode==='retry')
      ? '다시 풀기 — <b>' + (QZ.idx+1) + '번 문제</b>'
      : '문제 <b>' + (QZ.idx+1) + '</b> / 2';
  qEl('qtag').textContent = (levelIdx+1) + '라운드 클리어! · 탄성력 퀴즈';
  qEl('qfig').innerHTML = q.fig || '';
  qEl('qfig').style.display = q.fig ? 'block' : 'none';
  qEl('qtext').innerHTML = q.q;
  var box = qEl('qchoices');
  box.className = (q.kind==='ox') ? 'ox' : '';
  box.innerHTML = '';
  q.choices.forEach(function(c, i){
    var b = document.createElement('button');
    b.className = 'qch'; b.innerHTML = c;
    b.onclick = function(){ answerQ(i); };
    box.appendChild(b);
  });
  qEl('qfeed').style.display = 'none';
  qEl('qbtns').innerHTML = '';
  if(teacher){
    var sk = document.createElement('button');
    sk.className = 'btn2 ghost';
    sk.textContent = '건너뛰기 (선생님)';
    sk.onclick = function(){ quizPass(); };
    qEl('qbtns').appendChild(sk);
  }
}

function answerQ(i){
  if(QZ.locked) return;
  QZ.locked = true;
  var q = QZ.qs[QZ.idx];
  var ok = (i === q.ans);
  var btns = qEl('qchoices').children;
  for(var k=0;k<btns.length;k++){
    if(k===q.ans) btns[k].className = 'qch ok';
    else if(k===i) btns[k].className = 'qch no';
    else btns[k].className = 'qch dim';
    btns[k].onclick = null;
  }
  if(QZ.mode==='retry') QZ.retryOk = ok; else QZ.res[QZ.idx] = ok;
  if(ok) SFX.win(); else SFX.lose();

  var f = qEl('qfeed');
  f.className = ok ? 'ok' : 'no';
  f.innerHTML = '<span class="ft">' + (ok ? '정답!' : '아쉬워…') + '</span>' + q.expl;
  f.style.display = 'block';

  var last = (QZ.mode==='retry') || (QZ.idx===1);
  var b = document.createElement('button');
  b.className = 'btn2';
  b.textContent = last ? '채점하기 →' : '다음 문제 →';
  b.onclick = last ? gradeQuiz : nextQ;
  qEl('qbtns').innerHTML = '';
  qEl('qbtns').appendChild(b);
}

function nextQ(){ QZ.idx = 1; QZ.locked = false; renderQ(); }

function gradeQuiz(){
  if(QZ.mode==='retry'){
    if(QZ.retryOk) quizPass(); else quizFail('다시 푼 문제도 틀렸어.');
    return;
  }
  var a = QZ.res[0], b = QZ.res[1];
  if(a && b){ quizPass(); return; }
  if(!a && !b){ quizFail('두 문제 모두 틀렸어.'); return; }
  // 한 문제만 틀림 → 그 문제만 다시
  QZ.mode = 'retry';
  QZ.idx = a ? 1 : 0;
  QZ.locked = false;
  reshuffleQuestion(QZ.qs[QZ.idx]);
  qEl('qfig').innerHTML = '';
  qEl('qtext').innerHTML = '';
  qEl('qchoices').innerHTML = '';
  var f = qEl('qfeed');
  f.className = 'no';
  f.innerHTML = '<span class="ft">한 문제를 틀렸어</span>해설을 다시 읽고, 틀린 문제를 한 번 더 풀어 보자. ' +
                '여기서도 틀리면 라운드를 다시 플레이해야 해.';
  f.style.display = 'block';
  qEl('qstep').innerHTML = '한 문제 남았어';
  qEl('qbtns').innerHTML = '';
  var btn = document.createElement('button');
  btn.className = 'btn2'; btn.textContent = '다시 풀기 →';
  btn.onclick = function(){ renderQ(); };
  qEl('qbtns').appendChild(btn);
}

function quizPass(){
  // 퀴즈까지 통과해야 클리어 기록 + 다음 라운드 해금
  // (선생님 모드에서는 학생 기기의 진행 기록을 건드리지 않는다)
  if(!teacher){
    var st = starsFor(score);
    var key = ''+levelIdx;
    if(!progress.stars[key] || progress.stars[key] < st) progress.stars[key] = st;

  showResultCard(true);
}

/* ============================================================
   보너스 미니게임 — 머쉬룸 점프 슛
   (10라운드 클리어 후 해금 · 순수 재미용 점수 쌓기)
   ============================================================ */
var HP = null;
var HP_G      = 0.40;    // 중력 (px/step^2)
var HP_K      = 0.112;   // 당김 → 속도
var HP_MAXPULL= 142;
var HP_BALL_R = 16;
var HP_RIM_R  = 8;

function hoopBest(){ return progress.hoopBest||0; }

function toast(msg, ms){

  t.innerHTML=msg; t.style.display='block';
  clearTimeout(window._ttT);
  window._ttT=setTimeout(function(){ t.style.display='none'; }, ms||1800);
}

function startHoop(){
  zoom = 1; resize();
  HP = {
    anchor : { x: viewW*0.5, y: -176 },
    ball   : { x: viewW*0.5, y: -176, vx:0, vy:0 },

    dragging:false,
    hoop   : null,
    prevHoop: null,
    camY   : 0,
    camTY  : 0,
    score  : 0,
    made   : 0,
    combo  : 0,
    lives  : 3,
    t      : 0,
    touchedRim:false,
    trail  : [],

    texts  : [],

}

/* 높이 gap 을 '올라가며' 지나는 스텝과 '내려오며' 지나는 스텝 */
function hoopCrossSteps(py, gap){
  var vh = py*HP_K, h = 0, prevH = 0, tUp = -1;
  for(var i=1; i<=700; i++){
    vh -= HP_G; prevH = h; h += vh;
    if(tUp < 0 && prevH < gap && h >= gap && vh > 0) tUp = i;
    if(tUp > 0 && prevH > gap && h <= gap && vh < 0) return { up:tUp, down:i };
    if(h < -60) break;
  }
  return null;
}

/* 이 배치가 '정상적으로' 넣을 수 있는 구도인지 검사.
   - 내려오며 고리 안으로 들어가는 해가 있어야 하고
   - 그 궤적이 올라갈 때는 고리 밖을 지나야 한다 (밑에서 링을 뚫고 올라가면 안 되니까) */
function hoopFeasible(dx, gap, r){
  var adx = Math.abs(dx);
  for(var py=40; py<=HP_MAXPULL; py+=2){
    var t = hoopCrossSteps(py, gap);
    if(!t) continue;
    var vx = adx / t.down;
    var px = vx / HP_K;
    if(px > Math.sqrt(Math.max(0, HP_MAXPULL*HP_MAXPULL - py*py))) continue;
    var xUp = vx * t.up;                    // 올라가며 고리 높이를 지날 때의 가로 위치
    if(adx - xUp > r + 10) return true;     // 그때 링 밖이면 OK
  }
  return false;
}

function spawnHoop(){
  var n = HP.made;
  var margin = 80;
  var amp = n >= 4 ? Math.min(120, (n-3)*14) : 0;
  var r   = 44 - Math.min(10, n*0.5);
  // 화면 가장자리에 붙어 있으면 반대쪽으로 보내 준다 (한쪽으로 쏠리는 것 방지)
  var side;
  if(HP.anchor.x > viewW*0.66)      side = -1;
  else if(HP.anchor.x < viewW*0.34) side =  1;
  else                              side = (Math.random()<0.5 ? -1 : 1);
  var lo = margin + amp, hi = viewW - margin - amp;
  if(lo > hi){ lo = hi = viewW/2; }

  var gap, off, bx, ok=false;
  for(var tryN=0; tryN<24 && !ok; tryN++){
    var ease = tryN*0.05;                                   // 실패할수록 조금씩 쉽게
    gap = (116 + Math.min(52, n*4) + Math.random()*26) * (1 - ease*0.5);
    gap = Math.max(100, gap);
    var reach = Math.min(gap*1.15, 190);
    var minOff = Math.max(96, reach*0.60);                  // 바로 위에는 절대 안 생기게
    if(minOff > reach) minOff = reach*0.9;
    off = (minOff + Math.random()*(reach-minOff)) * side;
    bx  = Math.max(lo, Math.min(hi, HP.anchor.x + off));
    var realOff = bx - HP.anchor.x;
    if(Math.abs(realOff) < 90){                             // 클램프로 가까워졌으면 반대쪽
      bx = Math.max(lo, Math.min(hi, HP.anchor.x - off));
      realOff = bx - HP.anchor.x;
    }
    if(Math.abs(realOff) < 90) continue;
    ok = hoopFeasible(realOff, gap, r);
  }
  if(!ok){                                                  // 마지막 안전장치
    gap = 120;
    bx  = Math.max(lo, Math.min(hi, HP.anchor.x + 120*side));
    if(Math.abs(bx - HP.anchor.x) < 90) bx = Math.max(lo, Math.min(hi, HP.anchor.x - 120*side));
  }
  // 좌우로 움직이는 고리라도 버섯 머리 바로 위까지는 못 오게 진폭을 제한
  var span = Math.abs(bx - HP.anchor.x) - (r + 30);
  if(amp > span) amp = Math.max(0, span);

  HP.prevHoop = HP.hoop;
  HP.hoop = {
    bx: bx, x: bx, y: HP.anchor.y - gap,
    r: r,
    amp: amp,
    sp : 0.7 + Math.min(1.0, n*0.05),
    ph : Math.random()*6.28
  };
}

function hoopHUD(){
  document.getElementById('hpScore').textContent = HP.score.toLocaleString();
  document.getElementById('hpHeight').textContent = Math.max(0, Math.round((HP.startY - HP.anchor.y)/26));
  document.getElementById('hpLife').textContent = HP.lives;
  document.getElementById('hpBest').textContent = hoopBest().toLocaleString();
}

function hoopText(x,y,t,c){ HP.texts.push({x:x,y:y,t:t,c:c,life:1}); }
function hoopBurst(x,y,c,n){
  for(var i=0;i<n;i++) HP.fx.push({x:x,y:y,vx:(Math.random()-0.5)*7,vy:-Math.random()*6-1,
    s:2+Math.random()*4, c:c, life:1});
}

/* ---------- 입력 ---------- */
function hoopDown(ev){
  if(HP.over || HP.flying) return;
  HP.dragging = true;
  hoopMoveTo(ev);
  try{ canvas.setPointerCapture(ev.pointerId); }catch(e){}
}
function hoopMove(ev){ if(HP.dragging) hoopMoveTo(ev); }
function hoopMoveTo(ev){
  var r = canvas.getBoundingClientRect();
  var cx = (ev.clientX-r.left)/r.width*canvas.width;
  var cy = (ev.clientY-r.top)/r.height*canvas.height;
  var wx = cx/scale, wy = cy/scale + HP.camY;
  var dx = wx - HP.anchor.x, dy = wy - HP.anchor.y;
  var d = Math.hypot(dx,dy);
  if(d > HP_MAXPULL){ dx = dx/d*HP_MAXPULL; dy = dy/d*HP_MAXPULL; d = HP_MAXPULL; }
  if(dy < 6) { // 위로는 당길 수 없음 (아래로 당겨야 위로 날아감)
    dy = 6; var m=Math.hypot(dx,dy);
    if(m>HP_MAXPULL){ dx=dx/m*HP_MAXPULL; dy=dy/m*HP_MAXPULL; }
  }
  var prev = Math.hypot(HP.pull.x, HP.pull.y);
  HP.pull = {x:dx, y:dy};
  if(Math.abs(Math.hypot(dx,dy)-prev) > 16) SFX.stretch();
}
function hoopUp(){
  if(!HP.dragging) return;
  HP.dragging = false;
  var d = Math.hypot(HP.pull.x, HP.pull.y);
  if(d < 16){ HP.pull={x:0,y:0}; return; }
  HP.ball.x = HP.anchor.x; HP.ball.y = HP.anchor.y;
  HP.ball.vx = -HP.pull.x * HP_K;
  HP.ball.vy = -HP.pull.y * HP_K;
  HP.flying = true;
  HP.touchedRim = false;
  HP.trail = [];
  HP.pull = {x:0,y:0};
  SFX.launch();
}

/* ---------- 진행 ---------- */
function hoopTick(dt){
  HP.t += dt;
  var n = Math.min(4, Math.max(1, Math.round(dt*60)));
  for(var i=0;i<n;i++) hoopStep();
  // 파티클 · 텍스트
  for(i=HP.fx.length-1;i>=0;i--){
    var p=HP.fx[i]; p.vy+=0.4; p.x+=p.vx; p.y+=p.vy; p.life-=dt*1.1;
    if(p.life<=0) HP.fx.splice(i,1);
  }
  for(i=HP.texts.length-1;i>=0;i--){
    HP.texts[i].y -= 0.9; HP.texts[i].life -= dt*0.75;
    if(HP.texts[i].life<=0) HP.texts.splice(i,1);
  }
  if(HP.flash>0) HP.flash -= dt;
  HP.camY += (HP.camTY - HP.camY) * Math.min(1, dt*4.2);
  hoopHUD();
}

function hoopStep(){
  var h = HP.hoop;
  if(h){
    h.ph += 0.016*h.sp;
    h.x = h.bx + Math.sin(h.ph)*h.amp;
    var mg = 60;
    if(h.x < mg) h.x = mg; if(h.x > viewW-mg) h.x = viewW-mg;
  }
  if(!HP.flying || HP.over) return;

  var b = HP.ball, prevY = b.y;
  b.vy += HP_G;
  b.x += b.vx; b.y += b.vy;
  HP.trail.push({x:b.x,y:b.y});
  if(HP.trail.length > 90) HP.trail.shift();

  // 좌우 벽 튕김
  if(b.x < HP_BALL_R){ b.x = HP_BALL_R; b.vx = Math.abs(b.vx)*0.72; SFX.hit(); }
  if(b.x > viewW-HP_BALL_R){ b.x = viewW-HP_BALL_R; b.vx = -Math.abs(b.vx)*0.72; SFX.hit(); }

  // 림 충돌 (좌우 두 개) — 올라갈 때는 통과, '떨어질 때'만 림에 맞는다
  if(h && b.vy > 0){
    var rims = [ {x:h.x-h.r, y:h.y}, {x:h.x+h.r, y:h.y} ];
    for(var i=0;i<2;i++){
      var dx = b.x-rims[i].x, dy = b.y-rims[i].y;
      var d = Math.hypot(dx,dy), rr = HP_BALL_R + HP_RIM_R;
      if(d < rr && d > 0.001){
        var nx=dx/d, ny=dy/d;
        b.x = rims[i].x + nx*rr; b.y = rims[i].y + ny*rr;
        var vn = b.vx*nx + b.vy*ny;
        b.vx = (b.vx - 2*vn*nx)*0.62;
        b.vy = (b.vy - 2*vn*ny)*0.62;
        HP.touchedRim = true;
        SFX.wood();
      }
    }
  }
  // 아래에서 링을 뚫고 올라가는 건 불가 — 링 밑면에 맞고 튕긴다
  if(h && prevY > h.y && b.y <= h.y && b.vy < 0 && Math.abs(b.x - h.x) < h.r){
    b.y = h.y + 1;
    b.vy = Math.abs(b.vy)*0.45;
    b.vx *= 0.8;
    HP.touchedRim = true;
    SFX.wood();
  }
  // 골 판정 : 농구처럼 고리 '위에서 아래로' 떨어지며 들어가야 인정
  if(h && prevY < h.y && b.y >= h.y && b.vy > 0){
    if(Math.abs(b.x - h.x) < h.r - 3){ hoopScore(); return; }
  }

  // 실패 : 발사 지점보다 아래로 떨어짐
  if(b.vy > 0 && b.y > HP.anchor.y + 120){ hoopMiss(); }
}

function hoopScore(){
  var h = HP.hoop, b = HP.ball;
  var clean = !HP.touchedRim;          // 림을 안 건드리고 그대로 꽂히면 클린샷
  HP.lastClean = clean;
  HP.made++;
  HP.combo++;
  if(HP.combo > (HP.bestCombo||0)) HP.bestCombo = HP.combo;
  var got = clean ? 2 : 1;
  HP.score += got;

  hoopText(h.x, h.y-34, (clean?'클린샷! +2':'골인! +1'), clean?'#7CFFB0':'#ffd76a');
  if(HP.combo>2) hoopText(h.x, h.y-70, HP.combo+'연속!', '#c9b6ff');
  hoopBurst(h.x, h.y, clean?'#7CFFB0':'#ffd76a', clean?22:12);
  HP.flash = clean?0.18:0.10;
  if(clean){ SFX.win(); } else { SFX.snail(); }

  // 고리 자리에 착지 → 그 자리에서 다시 발사
  HP.anchor = { x:h.x, y:h.y };
  b.x=h.x; b.y=h.y; b.vx=0; b.vy=0;
  HP.flying = false;
  HP.trail = [];
  HP.camTY = HP.anchor.y - viewH*0.62;
  spawnHoop();
  if(HP.score > hoopBest()){ progress.hoopBest = HP.score; saveProgress(); }
}

function hoopMiss(){
  HP.lives--;
  HP.combo = 0;
  SFX.lose();
  hoopText(HP.ball.x, HP.ball.y, '놓쳤다!', '#ff9d9d');
  HP.flying = false;
  HP.trail = [];
  HP.ball.x = HP.anchor.x; HP.ball.y = HP.anchor.y;
  HP.ball.vx = 0; HP.ball.vy = 0;
  if(HP.lives <= 0) hoopOver();
}

function hoopOver(){
  HP.over = true;
  if(HP.score > hoopBest()){ progress.hoopBest = HP.score; saveProgress(); }
  document.getElementById('hoTitle').textContent = '게임 오버 — 골 ' + HP.made + '개';
  document.getElementById('hoScore').textContent = HP.score.toLocaleString() + ' 점';
  document.getElementById('hoMsg').innerHTML =
    '최고 기록 <b>' + hoopBest().toLocaleString() + ' 점</b>' +
    (HP.bestCombo>1 ? ' · 최다 연속 <b>'+HP.bestCombo+'</b>' : '') + '<br>' +
    '<span style="font-size:12px;opacity:.8">골대 <b>위에서</b> 떨어뜨려 넣기 · 클린샷 2점 · 림 맞고 들어가면 1점</span>';
  document.getElementById('hoopover').style.display = 'flex';
}

function quitHoop(){
  document.getElementById('hoophud').style.display='none';
  document.getElementById('hoopover').style.display='none';
  HP = null;
  openSelect();
}

/* ---------- 그리기 ---------- */
function hoopRender(){
  var c = ctx;
  c.setTransform(1,0,0,1,0,0);
  c.clearRect(0,0,canvas.width,canvas.height);
  c.save();
  c.scale(scale, scale);
  c.translate(0, -HP.camY);

  var alt = Math.max(0, Math.min(1, (HP.startY - HP.camY - viewH) / 2600));
  var top = HP.camY, bot = HP.camY + viewH;
  var g = c.createLinearGradient(0, top, 0, bot);
  function mix(a,b,t){ return [Math.round(a[0]+(b[0]-a[0])*t), Math.round(a[1]+(b[1]-a[1])*t), Math.round(a[2]+(b[2]-a[2])*t)]; }
  var c1 = mix([127,196,232],[10,14,44], alt), c2 = mix([191,228,242],[30,42,86], alt);
  g.addColorStop(0,'rgb('+c1.join(',')+')');
  g.addColorStop(1,'rgb('+c2.join(',')+')');
  c.fillStyle=g; c.fillRect(-10, top-10, viewW+20, viewH+20);

  // 별
  if(alt > 0.12){
    c.save(); c.globalAlpha = Math.min(1,(alt-0.12)*2.2); c.fillStyle='#fff';
    for(var i=0;i<70;i++){
      var sxp = ((i*173)%1000)/1000*viewW;
      var syp = -((i*331)%4000) - 200;
      var yy = syp + ((HP.camY*0.35)%4000);
      while(yy < top-50) yy += 4000;
      while(yy > bot+50) yy -= 4000;
      c.globalAlpha = Math.min(1,(alt-0.12)*2.2) * (0.35+((i*7)%10)/14);
      c.fillRect(sxp, yy, 2, 2);
    }
    c.restore();
  }
  // 구름 (낮은 고도)
  if(alt < 0.8){
    c.save(); c.globalAlpha = 0.75*(1-alt);
    c.fillStyle='#fff';
    for(var k=0;k<7;k++){
      var cx2 = ((k*263)%1000)/1000*viewW;
      var cy2 = -k*420 - 160;
      if(cy2 < top-140 || cy2 > bot+140) continue;
      c.save(); c.translate(cx2, cy2); c.scale(0.8,0.8);
      c.beginPath(); c.arc(0,0,26,0,7); c.arc(30,-11,34,0,7); c.arc(66,2,25,0,7); c.arc(34,14,28,0,7); c.fill();
      c.restore();
    }
    c.restore();
  }

  // 바닥
  if(bot > -60){
    c.fillStyle='#7a5a34'; c.fillRect(-10, 0, viewW+20, 400);
    var gg=c.createLinearGradient(0,0,0,36);
    gg.addColorStop(0,'#86c85e'); gg.addColorStop(1,'#5f9a3f');
    c.fillStyle=gg; c.fillRect(-10, 0, viewW+20, 36);
  }

  // 시작 발판
  if(HP.startY > top-40 && HP.startY < bot+40){
    var px0 = viewW*0.5;
    c.fillStyle='#8b5e30';
    rr(c, px0-52, HP.startY+8, 104, 16, 6); c.fill();
    c.fillStyle='#6d4522';
    c.fillRect(px0-8, HP.startY+22, 16, 200);
  }

  // 지난 고리 (흐리게)
  if(HP.prevHoop) drawHoopRing(c, HP.prevHoop, 0.28);
  if(HP.hoop) drawHoopRing(c, HP.hoop, 1);

  // 궤적
  if(HP.trail.length>3){
    c.fillStyle='rgba(255,255,255,0.55)';
    for(var t=0;t<HP.trail.length;t+=4){
      c.beginPath(); c.arc(HP.trail[t].x, HP.trail[t].y, 2.6,0,7); c.fill();
    }
  }

  // 조준 고무줄 + 버섯
  var ax = HP.anchor.x, ay = HP.anchor.y;
  var bx = HP.flying ? HP.ball.x : ax + HP.pull.x;
  var by = HP.flying ? HP.ball.y : ay + HP.pull.y;
  if(!HP.flying){
    c.strokeStyle='#6b3f1d'; c.lineWidth=7; c.lineCap='round';
    c.beginPath(); c.moveTo(ax-24, ay); c.lineTo(bx, by); c.lineTo(ax+24, ay); c.stroke();
    c.fillStyle='rgba(255,255,255,0.75)';
    c.beginPath(); c.arc(ax-24, ay, 5, 0, 7); c.fill();
    c.beginPath(); c.arc(ax+24, ay, 5, 0, 7); c.fill();
  }
  c.save();
  c.translate(bx, by);
  c.rotate(HP.flying ? HP.ball.x*0.02 : 0);
  drawShroom(c, SHROOM.orange, HP_BALL_R, true, HP.flying);
  c.restore();

  // 당김 표시 (탄성력)
  if(!HP.flying && (HP.pull.x||HP.pull.y)){
    var d = Math.hypot(HP.pull.x, HP.pull.y);
    var cm = d*CM_PER_PX, F = cm*SPRING_K;
    var ux = -HP.pull.x/(d||1), uy = -HP.pull.y/(d||1), len = 36+d*0.75;
    c.save();
    c.strokeStyle='rgba(255,70,70,0.95)'; c.lineWidth=6; c.lineCap='round';
    c.beginPath(); c.moveTo(bx,by); c.lineTo(bx+ux*len, by+uy*len); c.stroke();
    var hx=bx+ux*len, hy=by+uy*len, an=Math.atan2(uy,ux);
    c.fillStyle='rgba(255,70,70,0.95)';
    c.beginPath();
    c.moveTo(hx+Math.cos(an)*15, hy+Math.sin(an)*15);
    c.lineTo(hx+Math.cos(an+2.5)*13, hy+Math.sin(an+2.5)*13);
    c.lineTo(hx+Math.cos(an-2.5)*13, hy+Math.sin(an-2.5)*13);
    c.closePath(); c.fill();
    var panY = HP.camY + 64;
    c.fillStyle='rgba(20,28,40,0.78)';
    rr(c, viewW/2-108, panY, 216, 32, 11); c.fill();
    c.strokeStyle='rgba(255,255,255,0.22)'; c.lineWidth=1.5; c.stroke();
    c.font='bold 15px "Noto Sans KR", sans-serif'; c.textAlign='center';
    c.fillStyle='#ffe9a8';
    c.fillText(cm.toFixed(1)+' cm  ·  '+F.toFixed(1)+' N', viewW/2, panY+22);
    c.restore();
  }

  // 파티클 · 텍스트
  for(var f=0;f<HP.fx.length;f++){
    var p=HP.fx[f];
    c.save(); c.globalAlpha=Math.max(0,p.life); c.fillStyle=p.c;
    c.fillRect(p.x-p.s/2, p.y-p.s/2, p.s, p.s); c.restore();
  }
  c.textAlign='center';
  for(var q=0;q<HP.texts.length;q++){
    var T=HP.texts[q];
    c.save(); c.globalAlpha=Math.max(0,T.life);
    c.font='bold 24px "Noto Sans KR", sans-serif';
    c.lineWidth=5; c.strokeStyle='rgba(0,0,0,0.55)';
    c.strokeText(T.t, T.x, T.y); c.fillStyle=T.c; c.fillText(T.t, T.x, T.y);
    c.restore();
  }
  c.restore();

  if(HP.flash>0){
    c.save(); c.globalAlpha=Math.min(0.28, HP.flash*1.6);
    c.fillStyle='#fff'; c.fillRect(0,0,canvas.width,canvas.height); c.restore();
  }
}

function drawHoopRing(c, h, alpha){
  c.save(); c.globalAlpha = alpha;
  var rx = h.r, ry = h.r*0.30;
  // 그물
  c.strokeStyle='rgba(255,255,255,0.55)'; c.lineWidth=1.6;
  for(var i=0;i<9;i++){
    var a = i/8*Math.PI*2;
    var px = h.x + Math.cos(a)*rx, py = h.y + Math.sin(a)*ry;
    c.beginPath(); c.moveTo(px, py);
    c.lineTo(h.x + Math.cos(a)*rx*0.45, h.y + ry + 34);
    c.stroke();
  }
  c.strokeStyle='rgba(255,255,255,0.4)'; c.lineWidth=1.4;
  for(var r2=1;r2<=2;r2++){
    c.beginPath();
    c.ellipse(h.x, h.y + r2*15, rx*(1-r2*0.22), ry*(1-r2*0.18), 0, 0, 7);
    c.stroke();
  }
  // 림
  c.strokeStyle='#ff7b3d'; c.lineWidth=7;
  c.beginPath(); c.ellipse(h.x, h.y, rx, ry, 0, 0, 7); c.stroke();
  c.strokeStyle='rgba(255,220,180,0.6)'; c.lineWidth=2.4;
  c.beginPath(); c.ellipse(h.x, h.y, rx, ry, 0, Math.PI, Math.PI*2); c.stroke();
  // 림 양끝 (충돌 지점)
  c.fillStyle='#e85c22';
  c.beginPath(); c.arc(h.x-rx, h.y, HP_RIM_R, 0, 7); c.fill();
  c.beginPath(); c.arc(h.x+rx, h.y, HP_RIM_R, 0, 7); c.fill();
  // 움직이는 고리 표시
  if(h.amp > 0 && alpha > 0.5){
    c.strokeStyle='rgba(255,200,120,0.35)'; c.lineWidth=2; c.setLineDash([5,5]);
    c.beginPath(); c.moveTo(h.bx-h.amp, h.y); c.lineTo(h.bx+h.amp, h.y); c.stroke();
    c.setLineDash([]);
  }
  c.restore();
}

   render

var timeAcc=0;
function render(dt){
  timeAcc+=dt;
  var c=ctx;
  c.setTransform(1,0,0,1,0,0);
  c.clearRect(0,0,canvas.width,canvas.height);
  if(state==='title'||state==='select'){ drawMenuBg(c); return; }

  c.save();
  c.scale(scale, scale);
  c.translate(0,-camY);
  var sx = (shake>0)? (Math.random()-0.5)*shake : 0;
  var sy = (shake>0)? (Math.random()-0.5)*shake : 0;

  drawSky(c);
  c.save(); c.translate(sx,sy);
  drawClouds(c, timeAcc);
  drawHills(c);
  c.translate(-camX,0);
  drawGround(c);

  // 지난 궤적
  if(lastTrail.length>3){
    c.fillStyle='rgba(255,255,255,0.55)';
    for(var i=0;i<lastTrail.length;i+=9){
      c.beginPath(); c.arc(lastTrail[i].x, lastTrail[i].y, 3.2,0,7); c.fill();
    }
  }
  if(trail.length>3){
    c.fillStyle='rgba(255,255,255,0.8)';
    for(var i2=0;i2<trail.length;i2+=8){
      c.beginPath(); c.arc(trail[i2].x, trail[i2].y, 3.0,0,7); c.fill();
    }
  }

  drawSling(c, false);
  drawBands(c, false);

  // 블록
  for(var b=0;b<blocks.length;b++) if(!blocks[b].gd.dead) drawBlock(c, blocks[b]);

  // 달팽이
  for(var s=0;s<snails.length;s++){
    var sn=snails[s]; if(sn.gd.dead) continue;
    c.save(); c.translate(sn.position.x, sn.position.y); c.rotate(sn.angle);
    var bl = (Math.sin((timeAcc+sn.gd.blink)*1.6)>0.97);
    drawSnail(c, 17, sn.gd.hp<sn.gd.maxhp? (1-sn.gd.hp/sn.gd.maxhp)*0.35 : 0, bl);
    c.restore();
  }

  // 뿔 발사체
  var bods = Composite.allBodies(world);
  for(var i3=0;i3<bods.length;i3++){
    if(bods[i3].label!=='horn') continue;
    var hb=bods[i3];
    c.save(); c.translate(hb.position.x, hb.position.y); c.rotate(Math.atan2(hb.velocity.y, hb.velocity.x));
    c.fillStyle='#f2f0e4'; c.strokeStyle='#8c8878'; c.lineWidth=1.6;
    c.beginPath(); c.moveTo(13,0); c.lineTo(-8,6); c.lineTo(-8,-6); c.closePath(); c.fill(); c.stroke();
    c.restore();
  }

  // 버섯
  if(current){
    var cb=current.body;
    c.save(); c.translate(cb.position.x, cb.position.y);
    if(current.launched) c.rotate(cb.angle);
    drawShroom(c, current.def, current.def.r, true, state==='flying');
    if(state==='flying' && current.def.key==='horn' && !current.used){
      c.save();
      var pl=0.5+Math.sin(timeAcc*7)*0.5;
      c.globalAlpha=0.35+pl*0.45; c.strokeStyle='#ffe07a'; c.lineWidth=3;
      c.beginPath(); c.arc(0,0,current.def.r+10+pl*7,0,7); c.stroke();
      c.globalAlpha=0.9; c.fillStyle='#ffe07a'; c.textAlign='center';
      c.font='bold 20px "Noto Sans KR", sans-serif';
      c.lineWidth=4; c.strokeStyle='rgba(0,0,0,0.5)';
      c.strokeText('탭!', 0, -current.def.r-24); c.fillText('탭!', 0, -current.def.r-24);
      c.restore();
    }
    if(state==='zombieAim'||state==='zombieDrag'){
      c.save(); c.globalAlpha=0.55+Math.sin(timeAcc*6)*0.25;
      c.strokeStyle='#c9b6ff'; c.lineWidth=3;
      c.beginPath(); c.arc(0,0,current.def.r+14,0,7); c.stroke(); c.restore();
    }
    c.restore();
  }

  drawBands(c, true);
  drawSling(c, true);

  // 파편
  for(var d=0;d<debris.length;d++){
    var p=debris[d];
    c.save(); c.globalAlpha=Math.max(0,p.life); c.translate(p.x,p.y); c.rotate(p.rot);
    c.fillStyle=p.c; c.fillRect(-p.s/2,-p.s/2,p.s,p.s); c.restore();
  }
  // 점수 텍스트
  c.textAlign='center';
  for(var tx=0;tx<texts.length;tx++){
    var T=texts[tx];
    c.save(); c.globalAlpha=Math.max(0,T.life);
    c.font='bold 26px "Noto Sans KR", sans-serif';
    c.lineWidth=5; c.strokeStyle='rgba(0,0,0,0.55)';
    c.strokeText(T.t, T.x, T.y); c.fillStyle=T.c; c.fillText(T.t, T.x, T.y);
    c.restore();
  }

  // 탄성력 표시
  if((state==='drag'||state==='zombieDrag') && current){
    drawForceUI(c);
  }
  c.restore();  // shake
  c.restore();  // scale

  if(flashT>0){
    c.save(); c.globalAlpha=Math.min(0.3, flashT*2);
    c.fillStyle='#fff'; c.fillRect(0,0,canvas.width,canvas.height); c.restore();
  }
  updateHUD();
}

function drawForceUI(c){
  var a=anchorPoint();
  var d=Math.hypot(pull.x,pull.y);
  var cm=d*CM_PER_PX, F=cm*SPRING_K;
  var px=a.x+pull.x, py=a.y+pull.y;
  // 힘 화살표 (발사 방향)
  var ux=-pull.x/(d||1), uy=-pull.y/(d||1);
  var len=40+d*0.85;
  c.save();
  c.strokeStyle='rgba(255,70,70,0.95)'; c.lineWidth=7; c.lineCap='round';
  c.beginPath(); c.moveTo(px,py); c.lineTo(px+ux*len, py+uy*len); c.stroke();
  var hx=px+ux*len, hy=py+uy*len, ang=Math.atan2(uy,ux);
  c.fillStyle='rgba(255,70,70,0.95)';
  c.beginPath();
  c.moveTo(hx+Math.cos(ang)*17, hy+Math.sin(ang)*17);
  c.lineTo(hx+Math.cos(ang+2.5)*15, hy+Math.sin(ang+2.5)*15);
  c.lineTo(hx+Math.cos(ang-2.5)*15, hy+Math.sin(ang-2.5)*15);
  c.closePath(); c.fill();
  // 수치 패널
  var bx=a.x-116, by=a.y-176;
  c.fillStyle='rgba(20,28,40,0.78)'; rr(c,bx,by,232,64,12); c.fill();
  c.strokeStyle='rgba(255,255,255,0.25)'; c.lineWidth=2; c.stroke();
  c.textAlign='left'; c.fillStyle='#cfe3ff';
  c.font='500 17px "Noto Sans KR", sans-serif';
  c.fillText('늘어난 길이', bx+14, by+26);
  c.fillText('탄성력 F = k x', bx+14, by+51);
  c.textAlign='right'; c.fillStyle='#ffe9a8';
  c.font='bold 19px "Noto Sans KR", sans-serif';
  c.fillText(cm.toFixed(1)+' cm', bx+218, by+26);
  c.fillStyle='#ff9d9d';
  c.fillText(F.toFixed(1)+' N', bx+218, by+51);
  c.restore();
}

function drawMenuBg(c){
  c.save();
  c.scale(scale, scale);
  var g=c.createLinearGradient(0,0,0,viewH);
  g.addColorStop(0,'#5fb0da'); g.addColorStop(0.6,'#bfe4f2'); g.addColorStop(1,'#cfe6b0');
  c.fillStyle=g; c.fillRect(0,0,viewW+4,viewH+4);
  c.fillStyle='rgba(255,255,255,0.8)';
  for(var i=0;i<6;i++){
    var x=(i*310 - timeAcc*11)%(viewW+600)-200, y=60+((i*97)%180);
    c.save(); c.translate(x,y); c.beginPath();
    c.arc(0,0,26,0,7); c.arc(30,-11,34,0,7); c.arc(66,2,25,0,7); c.arc(34,14,28,0,7); c.fill(); c.restore();
  }
  c.fillStyle='#7fae74';
  c.beginPath(); c.moveTo(0,viewH);
  for(var x2=0;x2<=viewW+200;x2+=170) c.quadraticCurveTo(x2+85, viewH-160, x2+170, viewH-80);
  c.lineTo(viewW+200,viewH); c.closePath(); c.fill();
  c.restore();
}
